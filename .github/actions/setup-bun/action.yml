name: Set up pinned Bun
description: Verify and install the official npm binary without GitHub release downloads.
inputs:
  bun-version:
    description: Exact Bun version present in the archive pins.
    required: true
runs:
  using: composite
  steps:
    - id: binary
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: node scripts/ci/setup-bun.ts identify "$BUN_VERSION"
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: ${{ steps.binary.outputs.archive }}
        key: ${{ steps.binary.outputs.key }}
    - shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: node scripts/ci/setup-bun.ts install "$BUN_VERSION"
    - uses: actions/cache/save@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.binary.outputs.archive }}
        key: ${{ steps.binary.outputs.key }}
    # On the box, every CI container sees one writable directory; this Check's jobs share their own
    # e2e:prepare cache in it, so each step builds once per Check. Hosted runners build their own.
    - name: Share e2e build outputs among this Check's jobs on the box
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        if [ -n "${BASALT_BOX_SHARED:-}" ] && [ -d "$BASALT_BOX_SHARED" ]; then
          echo "EXECUTOR_E2E_CACHE=$BASALT_BOX_SHARED/e2e-prepare/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
        fi
