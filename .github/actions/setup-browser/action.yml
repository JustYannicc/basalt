name: Set up Chromium
description: Install the pinned Chromium and retain its system dependency downloads.
inputs:
  prepare-upstream:
    description: Prepare the pinned runtime inside the caller's existing setup deadline.
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare the pinned runtime
      if: inputs.prepare-upstream == 'true'
      shell: bash
      run: npm run prepare:upstream
    - name: Identify the system dependency package set
      id: packages
      shell: bash
      working-directory: .upstream
      run: |
        # For the rest of the job, apt reads sources.list and Ubuntu's own ubuntu.sources but no other
        # sources.list.d entry. Every browser package comes from the Ubuntu archives, so a third-party
        # source the image ships (Microsoft's once answered 429) must not fail the refresh; errors
        # from the Ubuntu archives still do.
        ubuntu_sources="$RUNNER_TEMP/apt-ubuntu-sources"
        mkdir -p "$ubuntu_sources"
        # A link, so the installer's later mirror rewrite of the real file still applies. Older
        # images keep their archives in sources.list instead, which apt still reads.
        if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
          ln -sf /etc/apt/sources.list.d/ubuntu.sources "$ubuntu_sources/"
        fi
        printf 'Dir::Etc::sourceparts "%s";\n' "$ubuntu_sources" |
          sudo tee /etc/apt/apt.conf.d/98-ubuntu-sources-only > /dev/null
        # Some hosted images omit indexes for otherwise supported Ubuntu packages.
        sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0 -o APT::Update::Error-Mode=any update
        node ../scripts/ci-browser-packages.ts
    - uses: actions/cache/restore@v4
      id: debs
      with:
        path: ${{ runner.temp }}/playwright-apt/*.deb
        key: playwright-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.packages.outputs.fingerprint }}
    - name: Install system dependencies with bounded mirror downloads
      shell: bash
      working-directory: .upstream
      env:
        DEBS_CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
      run: bash "$GITHUB_ACTION_PATH/install-deps.sh" "$DEBS_CACHE_HIT"
    - uses: actions/cache/save@v4
      if: steps.debs.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/playwright-apt/*.deb
        key: ${{ steps.debs.outputs.cache-primary-key }}
    - name: Install the pinned Chromium engine
      shell: bash
      working-directory: .upstream
      run: bunx playwright install chromium
