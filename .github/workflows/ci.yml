name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  E2E_BUN_VERSION: 1.4.2

jobs:
  client-connection:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun run --cwd clients typecheck
      - name: Verify headless connection through independent processes
        run: bun run --cwd clients test
  client-mobile:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/mobile --frozen-lockfile
      - run: bun run --cwd clients/mobile typecheck
      - run: bun run --cwd clients/mobile export:ios
      - run: bun run --cwd clients/mobile export:android
  client-desktop:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.platform == 'linux' && vars.BASALT_CI_RUNNER_HEAVY || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/desktop --frozen-lockfile
      - run: bun run --cwd clients/desktop typecheck
      - run: bun run --cwd clients/desktop build
      - name: Package the unsigned development client
        run: bun run --cwd clients/desktop package:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-desktop-${{ matrix.platform }}
          path: clients/desktop/dist-packages/Signalbox-Client-*
          if-no-files-found: error
  client-native-product:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: bun install --cwd clients --frozen-lockfile
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify native sign-in, renewal and tunnel through the real product
        run: bun e2e/native-client.mjs
      - name: Verify the phone controller with its own hosted grant and tool approvals
        run: bun e2e/native-mobile-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-product
          include-hidden-files: true
          path: |
            .generated/native-client-*/result.json
            .generated/native-client-*/failure.txt
            .generated/native-mobile-*/result.json
            .generated/native-mobile-*/failure*.txt
          if-no-files-found: warn
  slack-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify Slack health and retained accounts through the real server
        run: |
          mkdir -p .generated/slack-health
          git show "${{ github.event.pull_request.base.sha || github.event.before }}:src/catalog/slack.json" > .generated/slack-before-health.json
          bun e2e/slack-health.mjs .generated/slack-health/ci .generated/slack-before-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-health
          path: |
            .generated/slack-health/ci/report.json
            .generated/slack-health/ci/partial-results.json
            .generated/slack-health/ci/failure.txt
          if-no-files-found: warn
  host-managed-accounts:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify the pool accounts-ready measurement contract
        run: node --test scripts/pool-ui-tests/accounts-ready.test.mjs
      - name: Verify app query phase diagnostics
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^app query traces record ordered request phase durations$"
          --workers 1
      - name: Verify catalog service identity and import compatibility
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^Service installs reuse one team app|^Quick-add MCP apps retain package names|^MCP quick add confirms public"
          --workers 1
      - name: Verify host-managed visibility and existing account behavior
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "host-managed accounts are hidden|host-provisioned accounts keep working|account radio linking cannot replace|agent connection creation and updates|Executor app card shows|Executor installation shows|Executor installs each|A member's unlinked managed Executor key|a configured product name and logo|failed executor upgrades report a safe SQLSTATE|^Reviewed catalog OAuth clients|^Catalog OAuth grants|^account rows show retained usage and health|^Apps check a shared account their own way and report its identity$|^app-acquired account checks publish bounded status|^pool seed upgrades add canonical native slots|^native pool account links mirror current tokens only after hosted authorization|^native pool settings keep|^native sharing keeps existing|^invitation roles cannot grant|^organization admins who manage an app|^An account check and agents' discovery report an app whose tools do not load|^Pool creation preserves retained pools|^catalog instances keep every service family reachable|^app model bindings delegate one pool|^app model requests preserve refusals"
          --workers 1
      - name: Verify shared identities and incremental consent
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          "^Verified account rows retain|^An existing identity batches|^Existing Google declarations gain|^One consent connects|^Incremental consent retains|^Wrong identities denial|^Refresh and changed targets|^Additive identity storage|^Verified subjects group|^Covering grants share|^Separate grants never"
          --workers 1
      - name: Verify the private OAuth transport and hosted placement
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "^Hosted identity reuse preserves personal placement|^OAuth clients authenticate to services|^OAuth classifies token and callback error responses|^Agents learn safely when an MCP server needs them to write the app|^invitation roles cannot grant|^organization admins who manage an app"
          --workers 1
      - name: Verify account mirror retries and generations through the SDK HTTP host
        working-directory: .upstream
        run: bunx vitest run --config e2e/account-mirrors.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  oauth-account-regressions:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated OAuth test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify account deletion against concurrent OAuth renewal
        timeout-minutes: 5
        run: node scripts/oauth-removal-tests/prove.ts
      - name: Verify discarded rotated refresh revocation after account deletion
        timeout-minutes: 5
        run: node scripts/oauth-discard-tests/prove.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-account-regressions-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  pool-account-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated recovery test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify recovery through Cloud's real provisioning queue
        timeout-minutes: 5
        working-directory: .upstream
        env:
          BASALT_E2E_POOL_SETUP: "1"
        run: bun run e2e:cloud --test-name '^Cloud pool account recovery queues' --manual-cron --workers 1
      - name: Verify atomic pool setup with ordinary cron triggers
        timeout-minutes: 5
        working-directory: .upstream
        env:
          BASALT_E2E_POOL_SETUP: "1"
        run: bun run e2e:cloud --test-name '^Cloud pool account recovery publishes' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-account-recovery-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  sso-service-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated SSO test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the SSO journeys
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify OIDC and SAML through the private service binding
        working-directory: .upstream
        run: bun run e2e:cloud --test-name '^Cloud SSO (OIDC protocol|SAML)' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sso-service-binding-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/sso-idp.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  production-ops:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated production operation test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify runtime database binding with one isolated restart
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
        run: bun run e2e:cloud --test-name '^Cloud production operations bind' --workers 1
      - name: Verify encrypted production operation reads and backup refusal boundaries
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
        run: bun run e2e:cloud --test-name '^Cloud production operations (encrypt|scope)' --workers 1
      - name: Verify native provider links through the Cloud hosted API
        working-directory: .upstream
        env:
          BASALT_E2E_POOL_BACKEND: "1"
        run: bun run e2e:cloud --test-name '^Cloud native provider accounts link' --workers 1
      - name: Verify isolated billing policy and OIDC sign-in
        working-directory: .upstream
        run: bun run e2e:cloud --test-name '^Cloud (billing gates SSO|SSO OIDC setup preserves drafts)' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-ops-e2e
          include-hidden-files: true
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  production-ops-migrations:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated signed migration test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify exact provider account adoption through signed operations
        timeout-minutes: 5
        run: node scripts/production-ops/prove-provider-adoption.ts
      - name: Verify migration ownership through signed apply verification and replay
        timeout-minutes: 5
        env:
          BASALT_SCOPE_PROOF_PATTERN: ^Cloud production operations enforce (stable identities through apply and replay|organization references before verification)$
        run: node scripts/production-ops/prove-scope.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-ops-migrations-e2e
          include-hidden-files: true
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  production-ops-identity:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ startsWith(vars.BASALT_CI_RUNNER_HEAVY, 'boat') && fromJSON(vars.BASALT_CI_BOAT_MAX_PARALLEL || '1') || 8 }}
      matrix:
        include:
          - scope: diagnostics
            scenario: safe refusal and SQL cause classification
          - scope: credentials
            scenario: stable plans across credential rotation
          - scope: host
            scenario: the reviewed database host
          - scope: database
            scenario: the reviewed database name
          - scope: role
            scenario: the reviewed SQL login
          - scope: physical
            scenario: the reviewed physical database with equivalent fixture rows
          - scope: without-server
            scenario: database identity when the server identifier is unavailable
          - scope: release
            scenario: a fresh dry run after the reviewed deployment changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated signed migration test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify stable database identity through signed apply verification and replay
        timeout-minutes: 22
        env:
          BASALT_SCOPE_PROOF_PATTERN: '^Cloud production operations enforce ${{ matrix.scenario }}$'
        run: node scripts/production-ops/prove-scope.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-ops-identity-${{ matrix.scope }}-e2e
          include-hidden-files: true
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  compiler-diagnostics:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated compiler test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify a compiler deadline retains its phase trail
        timeout-minutes: 5
        working-directory: .upstream
        run: bun run e2e:cloud --test-name '^Cloud deploys fail promptly when the compiler does not answer' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-diagnostics-e2e
          include-hidden-files: true
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  human-in-the-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify workflow requests and scheduled approvals in the human-in-the-loop tab
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^Approvals answers free text|^Approvals renders custom|^hosted schedule controls enable|^Before a route|^Returning to loaded console pages|^Organization entry prefetches|^Dashboard loading shows content"
          --workers 1
      - name: Verify local navigation, custom displays and scheduled approvals
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          "^local Approvals renders|^browser schedule controls enable"
          --workers 1
      - name: Verify the human-in-the-loop route while Cloud code and data load
        working-directory: .upstream
        run: bun run e2e:cloud --test-name "^Before a route|^Organization entry prefetches|^Dashboard loading shows content" --workers 1
      - name: Verify browser analytics after server rendering
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "^Cloud product events preserve identity|^Cloud product events record onboarding replay|^Cloud support dialog lists"
          --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-in-the-loop-e2e
          path: .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  contributed-accounts:
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify contributed account authority and recovery
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^members contribute to opted-in app collections|^pending contributions recheck|^removing a member or leaving|^independent departure cleanup|^retained departure diagnostics migrate once|^unlinking or losing native app and account grants|^the Accounts tab names contributors"
          --workers 1
      - name: Verify contributed accounts through Cloud
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "^Cloud encrypted workflow|^members contribute to opted-in app collections|^pending contributions recheck|^departure diagnostics retain the real eighth failure|^removing a member or leaving|^unlinking or losing native app and account grants|^the Accounts tab names contributors"
          --workers 1
      - name: Verify editable workflow fields and departure questions
        run: |
          node e2e/recipe-checks.mjs .generated/alerting-checks/workflow-fields
          node e2e/departure-recipe-checks.mjs .generated/alerting-checks/departures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributed-accounts-e2e
          path: |
            .generated/alerting-checks/*/report.json
            .generated/alerting-checks/*/partial-checks.json
            .generated/alerting-checks/*/failure.txt
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  personal-data-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated reporting test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify reporting, retained data and registration isolation
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^scheduled personal-data reports|^personal-data|^account status preserves|^upgrading hosted storage from before app accounts"
          --workers 2
      - name: Verify Cloud scheduling and organization isolation
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "^scheduled personal-data reports|^personal-data reports use each organization"
          --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-data-reporting-e2e
          path: |
            .upstream/.local/e2e/**/report/**
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
          if-no-files-found: warn
  pool-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated Cloud test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the suite's browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify the Cloud inventory and exact-ID token retirement tooling
        working-directory: .upstream
        run: bun run e2e:cloud --test-name '^Cloud pool migration inventory|^Cloud retired pool token command' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-inventory-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  dashboard-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenario's browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Check Google BYO OAuth through the real self-host flow
        working-directory: .upstream
        run: bun run e2e:self-host --test-name 'Rejected OAuth clients remain editable|^Google OAuth choices keep'
      - name: Prove shared Google Admin OAuth selection through the pinned server
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p .generated/google-admin-snapshots
          curl --fail --silent --show-error --location --user-agent 'Mozilla/5.0' https://catalog.executor.sh/apps/google.json \
            --output .generated/google-admin-snapshots/google.json
          curl --fail --silent --show-error --location --user-agent 'Mozilla/5.0' https://catalog.executor.sh/apps/google-admin.json \
            --output .generated/google-admin-snapshots/google-admin.json
          candidate_sha="$(git rev-parse HEAD)"
          bun scripts/connectors-tests/google-admin.mjs \
            . \
            .generated/google-admin-snapshots \
            .generated/google-admin-proof \
            "$candidate_sha" \
            "$BASE_SHA"
      - name: Check the reviewed Google client through its native E2E scenario
        working-directory: .upstream
        run: bun run e2e:self-host --test-name '^The reviewed Google client follows' --workers 2
      - name: Retain the Google Admin proof summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-admin-oauth-proof
          path: .generated/google-admin-proof/**/google-admin-proof.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Compare the baseline and candidate through the real dashboard batch endpoint
        run: node scripts/profile-dashboard-batch.ts
      - name: Check Cloud resources stay within each dashboard batch request
        working-directory: .upstream
        run: bun run e2e:cloud --test-name 'Cloud dashboard batches share one SQL pool'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-batch-profile
          path: ${{ runner.temp }}/dashboard-batch-profile
          if-no-files-found: warn
  gitlab-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Prepare the pinned synthetic runtime
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account-site UI proof
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Exercise GitLab accounts against the real runtime
        run: node scripts/check-connectors.ts
        env:
          CONNECTORS_PROOF_DIRECT: "1"
          CONNECTORS_PROOF_SKIP_CLAUDE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitlab-account-site-ui
          path: .generated/connectors-proof/run-*/gitlab-account-site-*.png
          if-no-files-found: error
          include-hidden-files: true
  mcp-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Check the packaged app renderer
        working-directory: .upstream
        run: bun run mcp:apps --check
      - name: Build the isolated test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the renderer scenario's browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify captured views, source bindings and the packaged renderer
        working-directory: .upstream
        run: bun run e2e:self-host --test-name '^MCP Apps retain native|^MCP Apps preserve remote source|^MCP Apps render original|^App builds retain their selected npm framework' --workers 1
      - name: Verify encrypted retention, concurrent limits and restart
        working-directory: .upstream
        run: bun run e2e:local --test-name '^Local MCP Apps survive' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-apps-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/report/**
          include-hidden-files: true
          if-no-files-found: warn
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: fixture_root
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Architecture format and validation
        run: |
          npm run architecture:format
          npm run architecture:validate
      - name: Architecture model and code references
        run: |
          npm run architecture:model
          npm run architecture:typecheck
      - run: npm run check
      - name: Verify social sign-in and admin security boundaries
        run: |
          bun run --cwd .upstream patches:check
          bun run --cwd .upstream auth:security
      - name: Build documentation without Google font requests
        run: node scripts/docs-fonts/check.ts
      - name: Verify Cloud startup failure diagnostics
        working-directory: .upstream
        run: bunx vitest run --config e2e/alchemy-dev-output.config.ts
      - name: Check the pool acceptance runner
        run: node --test scripts/pool-acceptance/*.test.ts
      - name: Check the provider table against the pinned pool backend
        run: npm run check:providers
      - name: Check the pool bootstrap
        run: python3 -m unittest containers.pool.test_bootstrap containers.pool.test_sources containers.pool.test_output_privacy containers.pool.test_native_policy
      - name: Prove the output regression catches the previous image source
        run: |
          mkdir -p "$RUNNER_TEMP/pool-output-baseline"
          git archive b4ffc98c586aa8c6700fe95bd8a87aac0cc35847 containers/pool | tar -x -C "$RUNNER_TEMP/pool-output-baseline"
          cp containers/pool/test_output_privacy.py "$RUNNER_TEMP/pool-output-baseline/containers/pool/"
          cd "$RUNNER_TEMP/pool-output-baseline"
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_startup_errors_are_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_post_readiness_runtime_failure_is_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_http_handler_failure_cannot_print_response_token_or_address",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or result.errors or len(result.failures) != 3:
              raise SystemExit("Expected exactly three privacy assertion failures against the previous image source")
          print("All three previous-image output leaks reproduced; no setup errors")
          PY
      - name: Check carried host protocol records
        working-directory: .upstream
        run: bun run apps:protocols
      - name: Prove release updates, broken patches, rollback and preview cleanup gates
        run: |
          npm run check:releases
          npm run prove:releases
          npm run check:preview-auth
      - name: Architecture deployment generation
        run: |
          bun run --cwd .upstream/apps/hosted/cloud framework:build
          npm run architecture:deployment
          git diff --exit-code -- architecture/gen
          test -z "$(git ls-files --others --exclude-standard architecture/gen)"
          npm run architecture:validate
      - name: Architecture fitness functions
        env:
          ARCHITECTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run architecture:test
      - name: Free runner disk before pool builds
        run: |
          echo "Runner disk before cleanup (bytes)"
          df -B1 /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          docker builder prune --all --force
          echo "Runner disk after cleanup (bytes)"
          df -B1 /
      - name: Build the pinned pool image
        run: |
          mkdir -p "$RUNNER_TEMP/pool-usage-privacy-baseline"
          git archive b35314687e8972f64d7c1c3c73a1492a50fb7bac containers/pool | tar -x -C "$RUNNER_TEMP/pool-usage-privacy-baseline"
          docker build --target runtime --tag basalt-1409-pool:usage-privacy-baseline "$RUNNER_TEMP/pool-usage-privacy-baseline/containers/pool"
          docker build --target legacy-runtime --tag basalt-1409-pool:privacy-legacy "$RUNNER_TEMP/pool-usage-privacy-baseline/containers/pool"
          echo "Runner disk before compatibility build cache cleanup (bytes)"
          df -B1 /
          docker builder prune --all --force
          docker image inspect basalt-1409-pool:usage-privacy-baseline basalt-1409-pool:privacy-legacy > /dev/null
          echo "Runner disk before candidate build (bytes)"
          df -B1 /
          docker build --target runtime --tag basalt-1409-pool:test containers/pool
      - name: Check the pool runtime and database contracts
        run: node --test --test-concurrency=1 scripts/pool-tests/*.test.ts
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
          POOL_TEST_IMAGE: basalt-1409-pool:test
          POOL_TEST_LEGACY_IMAGE: basalt-1409-pool:privacy-legacy
          POOL_TEST_USAGE_PRIVACY_IMAGE: basalt-1409-pool:usage-privacy-baseline
      - name: Release pool build disk
        if: always()
        run: |
          echo "Runner disk before pool cleanup (bytes)"
          df -B1 /
          for image in basalt-1409-pool:test basalt-1409-pool:privacy-legacy basalt-1409-pool:usage-privacy-baseline; do
            if docker image inspect "$image" > /dev/null 2>&1; then
              docker image rm "$image"
            fi
          done
          docker builder prune --all --force
          echo "Runner disk after pool cleanup (bytes)"
          df -B1 /
      - run: npm run check:upstream
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
      - run: npm run build
      - run: npm run check:build
      - name: Check every Worker's startup CPU and size against Cloudflare's limits
        run: npm run check:startup
      - run: npm run typecheck
      # Upstream's own typecheck over the patched tree, so carried patches meet upstream's rules
      # (including its Effect diagnostics), not just the slice Basalt's typecheck covers.
      - name: Typecheck the patched upstream the way upstream checks itself
        run: npm run typecheck:upstream
      - name: Capture the checked pull request merge result
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        run: node scripts/release-merge/check-receipt.ts
      - uses: actions/upload-artifact@v4
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        with:
          name: ${{ format('release-check-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.run_attempt) }}
          path: ${{ runner.temp }}/check-receipt.json
          if-no-files-found: error
          retention-days: 1

