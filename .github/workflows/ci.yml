    if: contains(fromJSON(needs.select.outputs.jobs), 'upstream-contracts')
    runs-on: ubuntu-latest
    # About 2x its slowest measured hosted run (11.3 minutes), so a hung run never holds a runner
    # for GitHub's default six hours.
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
