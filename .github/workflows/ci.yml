name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, "batch/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  E2E_BUN_VERSION: 1.4.2

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.comparison.outputs.base_sha }}
      full_suite: ${{ steps.jobs.outputs.full_suite }}
      jobs: ${{ steps.jobs.outputs.jobs }}
      hosted_jobs: ${{ steps.jobs.outputs.hosted_jobs }}
      boat_jobs: ${{ steps.jobs.outputs.boat_jobs }}
      boat_jobs_csv: ${{ steps.jobs.outputs.boat_jobs_csv }}
      matrices: ${{ steps.jobs.outputs.matrices }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Resolve the comparison commit
        id: comparison
        env:
          BATCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ "$BATCH_PUSH" = true ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git merge-base "$HEAD_SHA" origin/main)"
          fi
          base="$(git rev-parse --verify "$base^{commit}")"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select the PR fast lane or full suite
        id: jobs
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOAT_JOBS: ${{ vars.BASALT_CI_BOAT_JOBS }}
          FULL_SUITE: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/') || contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'release-update') }}
        run: |
          if [ "$FULL_SUITE" = true ]; then
            node scripts/ci/select-jobs.ts --all
          else
            node scripts/ci/select-jobs.ts --fast
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: .generated/ci/selection.json
          include-hidden-files: true
          if-no-files-found: error
  cpa-pipeline:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CPA updater and pipeline boundary
        env:
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          python3 -m unittest discover -s scripts/cpa-tests
          python3 scripts/cpa-pipeline-guard.py --base "$BASE_SHA"
  client-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun run --cwd clients typecheck
      - name: Verify headless connection through independent processes
        run: bun run --cwd clients test
  client-mobile:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-mobile')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/mobile --frozen-lockfile
      - run: bun run --cwd clients/mobile typecheck
      - run: bun run --cwd clients/mobile export:ios
      - run: bun run --cwd clients/mobile export:android
  client-desktop:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-desktop')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/desktop --frozen-lockfile
      - run: bun run --cwd clients/desktop typecheck
      - run: bun run --cwd clients/desktop build
      - name: Package the unsigned development client
        run: bun run --cwd clients/desktop package:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-desktop-${{ matrix.platform }}
          path: clients/desktop/dist-packages/Signalbox-Client-*
          if-no-files-found: error
  client-native-product:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-native-product')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: bun install --cwd clients --frozen-lockfile
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify native sign-in, renewal and tunnel through the real product
        run: bun e2e/native-client.mjs
      - name: Verify the phone controller with its own hosted grant and tool approvals
        run: bun e2e/native-mobile-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-product
          include-hidden-files: true
          path: |
            .generated/native-client-*/result.json
            .generated/native-client-*/failure.txt
            .generated/native-mobile-*/result.json
            .generated/native-mobile-*/failure*.txt
          if-no-files-found: warn
  vercel-sign-in:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'vercel-sign-in')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify Vercel sign-in, retained tokens and both tool transports
        run: bun e2e/vercel-sign-in.mjs .generated/vercel-sign-in/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs vercel-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  elevenlabs-sign-in:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'elevenlabs-sign-in')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify ElevenLabs client metadata sign-in, retained tokens and audio approval
        run: bun e2e/elevenlabs-sign-in.mjs .generated/elevenlabs-sign-in/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs elevenlabs-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elevenlabs-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  slack-health:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'slack-health')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify Slack health and retained accounts through the real server
        run: |
          mkdir -p .generated/slack-health
          git show "${{ needs.select.outputs.base_sha }}:src/catalog/slack.json" > .generated/slack-before-health.json
          bun e2e/slack-health.mjs .generated/slack-health/ci .generated/slack-before-health.json
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs slack-health "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-health-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  catalog-compat:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'catalog-compat')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Build every catalog package as served, on the framework Basalt ships
        run: bun e2e/catalog-compat.mjs .generated/catalog-compat/ci all 8
      - name: Verify ElevenLabs tools load as the catalog serves it, with dropped routes
        run: bun e2e/elevenlabs-discovery.mjs .generated/elevenlabs-discovery/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs catalog-compat "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-compat-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  host-managed-accounts:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        uses: ./.github/actions/setup-browser
      - name: Verify the pool accounts-ready measurement contract
        run: node --test scripts/pool-ui-tests/accounts-ready.test.mjs
      - name: Verify app query phase diagnostics
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts:app-query-phase-diagnostics)"
          --workers 1
      - name: Verify catalog service identity and import compatibility
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts:catalog-service-identity-and-import-compatibility)"
          --workers 1
      - name: Verify host-managed visibility and existing account behavior
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts:host-managed-visibility-and-existing-account-behavior)"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-self-host-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn
  host-managed-accounts-pool:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts-pool')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        uses: ./.github/actions/setup-browser
      - name: Verify retained pool accounts and usage behavior
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-pool:retained-pool-accounts-and-usage-behavior)"
          --workers 1
      - name: Keep listed account actions usable during the detail read
        working-directory: .upstream
        run: bun run e2e:self-host --test-name "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-pool:listed-account-actions)" --workers 1
      - name: Verify bounded per-account usage through the public host API
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-pool:bounded-per-account-usage-through-the-public-host-api)"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-pool-self-host-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn
  host-managed-accounts-local:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts-local')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated local test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        uses: ./.github/actions/setup-browser
      - name: Verify shared identities and incremental consent
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-local:shared-identities-and-incremental-consent)"
          --workers 1
      - name: Collect bounded E2E evidence with original-run fallback
        if: always()
        run: node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: host-managed-accounts-local-e2e
          path: |
            ${{ runner.temp }}/basalt-e2e-evidence/**/results.json
            ${{ runner.temp }}/basalt-e2e-evidence/**/server.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/cloud.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/report/**
          if-no-files-found: warn
  host-managed-accounts-cloud:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts-cloud')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated Cloud test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        uses: ./.github/actions/setup-browser
      - name: Verify the private OAuth transport and hosted placement
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-cloud:the-private-oauth-transport-and-hosted-placement)"
          --workers 1
      - name: Keep listed account actions usable through Cloud
        working-directory: .upstream
        run: bun run e2e:cloud --test-name "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-cloud:listed-account-actions)" --workers 1
      - name: Verify shared account families and consumer capability refusals
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-cloud:shared-account-families-and-consumer-capability-refusals)"
          --workers 1
      - name: Verify one saved provider account supplies two native pools
        working-directory: .upstream
        run: bun run e2e:self-host --test-name "$(node ../scripts/ci/e2e-pattern.ts host-managed-accounts-cloud:one-saved-provider-account-supplies-two-native-pools)" --workers 1
      - name: Verify account mirror retries and generations through the SDK HTTP host
        working-directory: .upstream
        run: bunx vitest run --config e2e/account-mirrors.config.ts
      - name: Verify immutable account declarations across runtime protocols
        working-directory: .upstream
        run: bunx vitest run --config e2e/account-definition.config.ts
      - name: Collect bounded E2E evidence with original-run fallback
        if: always()
        run: node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: host-managed-accounts-cloud-e2e
          path: |
            ${{ runner.temp }}/basalt-e2e-evidence/**/results.json
            ${{ runner.temp }}/basalt-e2e-evidence/**/server.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/cloud.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/report/**
          if-no-files-found: warn
  google-account-recovery:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'google-account-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Prepare the pinned Google recovery runtime
        timeout-minutes: 2
        uses: ./.github/actions/setup-browser
        with:
          prepare-upstream: "true"
      - name: Build the isolated Google recovery test assets
        timeout-minutes: 2
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Verify the prepared Google recovery browser engine
        timeout-minutes: 1
        working-directory: .upstream
        run: node ../scripts/check-e2e-browser.mjs
      - name: Verify Google recovery through signed Cloud operations
        timeout-minutes: 6
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
          BASALT_E2E_PREBOOT_BINDING: "alternate"
          BASALT_ADOPTION_PROOF_WORKERS: "1"
        run: |
          BASALT_ADOPTION_PROOF_PATTERN="$(node scripts/ci/e2e-pattern.ts google-account-recovery:google-recovery-through-signed-cloud-operations)"
          export BASALT_ADOPTION_PROOF_PATTERN
          node scripts/production-ops/prove-provider-adoption.ts
      - name: Collect bounded E2E evidence with original-run fallback
        if: always()
        run: node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - name: Upload Google recovery evidence
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          include-hidden-files: true
          name: google-account-recovery-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud*.log
            .upstream/.local/e2e/**/cloud-forwarding-errors.ndjson
            .upstream/.local/e2e/**/report/**
            ${{ runner.temp }}/basalt-e2e-evidence/**/results.json
            ${{ runner.temp }}/basalt-e2e-evidence/**/server.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/cloud.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/report/**
          if-no-files-found: warn
  google-account-diagnostics:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'google-account-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Prepare the pinned Google recovery runtime
        timeout-minutes: 2
        uses: ./.github/actions/setup-browser
        with:
          prepare-upstream: "true"
      - name: Build the isolated Google recovery test assets
        timeout-minutes: 2
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Verify the prepared Google recovery browser engine
        timeout-minutes: 1
        working-directory: .upstream
        run: node ../scripts/check-e2e-browser.mjs
      - name: Verify saved Google client comparisons
        timeout-minutes: 3
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
          BASALT_E2E_GOOGLE_CLIENT_DIAGNOSTICS: configured
        run: bun run e2e:cloud --test-name "$(node ../scripts/ci/e2e-pattern.ts google-account-diagnostics:configured-client-diagnostics)" --workers 1
      - name: Verify unavailable Google client diagnostics
        timeout-minutes: 3
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
          BASALT_E2E_GOOGLE_CLIENT_DIAGNOSTICS: unconfigured
        run: bun run e2e:cloud --test-name "$(node ../scripts/ci/e2e-pattern.ts google-account-diagnostics:unconfigured-client-diagnostics)" --workers 1
      - name: Collect bounded E2E evidence with original-run fallback
        if: always()
        run: node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - name: Upload Google client diagnostics evidence
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
