      - run: npm run check:upstream
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres

  check:
    name: ${{ (needs.select.outputs.reused == 'true' || needs.select.outputs.full_suite == 'true') && 'check' || needs.select.outputs.lane == 'affected' && 'check (affected)' || 'check (fast-only)' }}
    needs:
      [
        select,
        box-watch,
        long-started,
        fast,
        fast-units,
        browser-install,
        cpa-pipeline,
        workerd-assets,
        client-connection,
        client-mobile,
        client-desktop,
        client-native-product,
        slack-health,
        catalog-compat,
        host-managed-accounts,
        host-managed-accounts-adopted,
        host-managed-accounts-pool,
        host-managed-accounts-pool-actions,
        host-managed-accounts-local,
        host-managed-accounts-cloud,
        host-managed-accounts-cloud-actions,
        host-managed-accounts-runtime,
        google-account-recovery,
        google-account-diagnostics,
        oauth-account-regressions,
        pool-account-recovery,
        sso-service-binding,
        production-ops,
        production-ops-migrations,
        production-ops-atlassian-adoption,
        production-ops-identity,
        compiler-diagnostics,
        human-in-the-loop,
        human-in-the-loop-navigation,
        human-in-the-loop-cloud,
        access-editor-reads,
        contributed-accounts,
        contributed-account-recipes,
        personal-data-reporting,
        pool-inventory,
        dashboard-batch,
        aws-connectors,
        gitlab-connectors,
        mcp-apps,
        pool-runtime,
        upstream-image,
        production-build,
        docs-build,
        upstream-contracts,
        declared-self-host,
        declared-local,
        declared-cloud,
        account-acquisition,
        account-observations,
        account-usage,
        clerk-sign-in,
        workos-sign-in,
        gitlab-sign-in,
        planetscale-sign-in,
        vercel-sign-in,
        elevenlabs-sign-in,
        neon-key-reuse,
      ]
    if: always()
    outputs:
      reused_run_id: ${{ steps.gate.outputs.reused_run_id }}
      reused_head_sha: ${{ steps.gate.outputs.reused_head_sha }}
    runs-on: ubuntu-latest
    # actions: read lets a re-run attempt find the flake-rerun.yml run that started it.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - name: Say which listed flake this attempt re-ran
        # Only flake-rerun.yml's own re-run: a person's re-run, or a later attempt, is not one.
        if: >-
          always() && github.run_attempt == 2 &&
          github.triggering_actor == 'github-actions[bot]'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/flake-note.ts
      - name: Require every selected job or verified batch reuse to pass
        id: gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSED: ${{ needs.select.outputs.reused }}
          CI_REUSE_EVIDENCE: ${{ needs.select.outputs.evidence }}
          CI_FULL_SUITE: ${{ needs.select.outputs.full_suite }}
          CI_LANE: ${{ needs.select.outputs.lane }}
          # fast and the unit legs resolve the comparison and lane themselves; they must be select's.
          CI_BASE_SHA: ${{ needs.select.outputs.base_sha }}
          CI_FAST_LANE_BASE: ${{ needs.fast.outputs.lane_base }}
          CI_UNIT_LANE_BASES: ${{ toJSON(needs.fast-units.outputs) }}
          CI_JOBS: ${{ needs.select.outputs.jobs }}
          CI_BOX_JOBS: ${{ needs.select.outputs.box_jobs }}
        run: node scripts/ci/gate.ts
      - uses: actions/upload-artifact@v4
        if: success() && needs.select.outputs.reused == 'true'
        with:
          name: check-reuse-evidence
          path: check-reuse-evidence.json
          if-no-files-found: error
      - name: Capture the checked pull request merge result
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        run: node scripts/release-merge/check-receipt.ts
      - uses: actions/upload-artifact@v4
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        with:
          name: ${{ format('release-check-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.run_attempt) }}
          path: ${{ runner.temp }}/check-receipt.json
          if-no-files-found: error
          retention-days: 1
      # Informational: continue-on-error keeps the retry count from changing the gate's verdict.
      # A reused Check ran no shards, so it has nothing to count.
      - name: Download each declared shard's retry record
        if: always() && needs.select.outputs.reused != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-retries-*
          path: ${{ runner.temp }}/e2e-retries
      - name: Count declared E2E files that passed only on retry
        if: always() && needs.select.outputs.reused != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The planned shards, so a missing record makes the count incomplete rather than zero.
          CI_MATRICES: ${{ needs.select.outputs.matrices }}
          CI_JOBS: ${{ needs.select.outputs.jobs }}
        run: node scripts/ci/aggregate-retries.ts "$RUNNER_TEMP/e2e-retries" "$RUNNER_TEMP/check-e2e-retries/retries.json"
      - uses: actions/upload-artifact@v4
        if: always() && needs.select.outputs.reused != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: check-e2e-retries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-e2e-retries/retries.json
          if-no-files-found: warn
          retention-days: 90

  account-acquisition:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'account-acquisition')
    runs-on: ubuntu-latest
    # Measured 12.6-20.5 minutes on hosted runners in six full Checks; the slowest was cut at 20.
    # Its observation half now runs in account-observations.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Build the isolated account test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account tests
        uses: ./.github/actions/setup-browser
      - name: Verify reusable acquisition and retained account compatibility
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:reusable-acquisition-and-retained-account-compatibility)"
          --workers 1
      - name: Verify local account lifetime and observation provenance
        working-directory: .upstream
        run: bun run e2e:local --test-name "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:local-account-lifetime-and-observation-provenance)" --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-acquisition-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn

  account-observations:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'account-observations')
    runs-on: ubuntu-latest
    # About 1.5x the slower half of the split: at the slowest measured full Check's pace, this job
    # plans 11.3 minutes and account-acquisition 12.9.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Build the isolated account test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account tests
        uses: ./.github/actions/setup-browser
      - name: Verify driver readings, health and observation compatibility
        working-directory: .upstream
        run: >-
          node ../scripts/ci/with-published-frameworks.ts -- bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts account-observations:driver-readings-health-and-observation-compatibility)"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-observations-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn

  account-usage:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'account-usage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Build the isolated account test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account tests
        uses: ./.github/actions/setup-browser
      - name: Prove a released query hold leaves no request unanswered
        working-directory: .upstream
        run: bunx vitest run --config e2e/query-hold.config.ts
      - name: Verify account usage rows and cells
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:account-usage-rows-and-cells)"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-usage-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn
