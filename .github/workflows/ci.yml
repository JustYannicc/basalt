    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Check container Python names and imports
        run: |
          python3 -m venv "$RUNNER_TEMP/container-python-lint"
          "$RUNNER_TEMP/container-python-lint/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir ruff==0.16.1
          "$RUNNER_TEMP/container-python-lint/bin/ruff" check --isolated --select F \
            --config 'include = ["*.py"]' --target-version py312 \
            --no-respect-gitignore --no-cache containers
      - run: npm run prepare:upstream
      - name: Verify every adopted test declares its plan and CI job
        run: bun scripts/ci/check-plans.ts
      - name: Check workflow syntax
        run: node scripts/ci/check-workflows.ts
