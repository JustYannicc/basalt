name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  E2E_BUN_VERSION: 1.4.2

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
      hosted_jobs: ${{ steps.jobs.outputs.hosted_jobs }}
      boat_jobs: ${{ steps.jobs.outputs.boat_jobs }}
      boat_jobs_csv: ${{ steps.jobs.outputs.boat_jobs_csv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Select affected heavy jobs
        id: jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Temporary same-repository proof; remove after the measured PR run.
          BOAT_JOBS: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/boat-suite-runtime') && 'production-ops,production-ops-migrations,production-ops-identity,host-managed-accounts,contributed-accounts,oauth-account-regressions,account-acquisition,pool-account-recovery,compiler-diagnostics' || vars.BASALT_CI_BOAT_JOBS }}
          FULL_SUITE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-update') }}
        run: |
          if [ "$FULL_SUITE" = true ]; then
            node scripts/ci/select-jobs.ts --all
          else
            node scripts/ci/select-jobs.ts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: .generated/ci/selection.json
          include-hidden-files: true
          if-no-files-found: error
  cpa-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CPA updater and pipeline boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/cpa-tests
          python3 scripts/cpa-pipeline-guard.py --base "$BASE_SHA"
  client-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun run --cwd clients typecheck
      - name: Verify headless connection through independent processes
        run: bun run --cwd clients test
  client-mobile:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-mobile')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/mobile --frozen-lockfile
      - run: bun run --cwd clients/mobile typecheck
      - run: bun run --cwd clients/mobile export:ios
      - run: bun run --cwd clients/mobile export:android
  client-desktop:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-desktop')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/desktop --frozen-lockfile
      - run: bun run --cwd clients/desktop typecheck
      - run: bun run --cwd clients/desktop build
      - name: Package the unsigned development client
        run: bun run --cwd clients/desktop package:${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-desktop-${{ matrix.platform }}
          path: clients/desktop/dist-packages/Signalbox-Client-*
          if-no-files-found: error
  client-native-product:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'client-native-product')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: bun install --cwd clients --frozen-lockfile
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify native sign-in, renewal and tunnel through the real product
        run: bun e2e/native-client.mjs
      - name: Verify the phone controller with its own hosted grant and tool approvals
        run: bun e2e/native-mobile-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-product
          include-hidden-files: true
          path: |
            .generated/native-client-*/result.json
            .generated/native-client-*/failure.txt
            .generated/native-mobile-*/result.json
            .generated/native-mobile-*/failure*.txt
          if-no-files-found: warn
  vercel-sign-in:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'vercel-sign-in')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify Vercel sign-in, retained tokens and both tool transports
        run: bun e2e/vercel-sign-in.mjs .generated/vercel-sign-in/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vercel-sign-in
          path: |
            .generated/vercel-sign-in/ci/report.json
            .generated/vercel-sign-in/ci/partial-results.json
            .generated/vercel-sign-in/ci/upstream-calls.json
            .generated/vercel-sign-in/ci/failure.txt
          if-no-files-found: warn
  elevenlabs-sign-in:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'elevenlabs-sign-in')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify ElevenLabs client metadata sign-in, retained tokens and audio approval
        run: bun e2e/elevenlabs-sign-in.mjs .generated/elevenlabs-sign-in/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elevenlabs-sign-in
          path: |
            .generated/elevenlabs-sign-in/ci/report.json
            .generated/elevenlabs-sign-in/ci/partial-results.json
            .generated/elevenlabs-sign-in/ci/upstream-calls.json
            .generated/elevenlabs-sign-in/ci/failure.txt
          if-no-files-found: warn
  slack-health:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'slack-health')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify Slack health and retained accounts through the real server
        run: |
          mkdir -p .generated/slack-health
          git show "${{ github.event.pull_request.base.sha || github.event.before }}:src/catalog/slack.json" > .generated/slack-before-health.json
          bun e2e/slack-health.mjs .generated/slack-health/ci .generated/slack-before-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-health
          path: |
            .generated/slack-health/ci/report.json
            .generated/slack-health/ci/partial-results.json
            .generated/slack-health/ci/failure.txt
          if-no-files-found: warn
  catalog-compat:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'catalog-compat')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Build every catalog package as served, on the framework Basalt ships
        run: bun e2e/catalog-compat.mjs .generated/catalog-compat/ci all 8
      - name: Verify ElevenLabs tools load as the catalog serves it, with dropped routes
        run: bun e2e/elevenlabs-discovery.mjs .generated/elevenlabs-discovery/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-compat
          # Only these files: session files under .generated stay private.
          path: |
            .generated/catalog-compat/ci/report.json
            .generated/catalog-compat/ci/partial-results.json
            .generated/catalog-compat/ci/failure.txt
            .generated/elevenlabs-discovery/ci/result.json
            .generated/elevenlabs-discovery/ci/failure.txt
          include-hidden-files: true
          if-no-files-found: warn
  host-managed-accounts:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify the pool accounts-ready measurement contract
        run: node --test scripts/pool-ui-tests/accounts-ready.test.mjs
      - name: Verify app query phase diagnostics
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^app query traces record ordered request phase durations$"
          --workers 1
      - name: Verify catalog service identity and import compatibility
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^Service installs reuse one team app|^Quick-add MCP apps retain package names|^MCP quick add confirms public"
          --workers 1
      - name: Verify host-managed visibility and existing account behavior
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "host-managed accounts are hidden|host-provisioned accounts keep working|account radio linking cannot replace|agent connection creation and updates|Executor app card shows|Executor installation shows|Executor installs each|A member's unlinked managed Executor key|a configured product name and logo|failed executor upgrades report a safe SQLSTATE|^Reviewed catalog OAuth clients|^Catalog OAuth grants|^Hosted operator-client partial consent retains|^account rows show retained usage and health|^Apps check a shared account their own way and report its identity$|^app-acquired account checks publish bounded status|^pool seed upgrades add canonical native slots|^native pool account links mirror current tokens only after hosted authorization|^native pool settings keep|^native sharing keeps existing|^invitation roles cannot grant|^organization admins who manage an app|^An account check and agents' discovery report an app whose tools do not load|^an open account row shows newly retained usage|^the signed usage publish request refreshes native usage reports|^Pool creation preserves retained pools|^catalog instances keep every service family reachable|^app model bindings delegate one pool|^app model requests preserve refusals|^native pool usage (renders|preserves)|^Catalog OAuth deferrals"
          --workers 1
      - name: Verify bounded per-account usage through the public host API
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "^poolUsageSeries is manager-only and preserves one bounded decimal usage read$"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .upstream/.local/e2e .generated/ci-evidence/host-managed-accounts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-self-host-e2e
          path: .generated/ci-evidence/host-managed-accounts
          include-hidden-files: true
          if-no-files-found: warn
  host-managed-accounts-local:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts-local')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated local test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify shared identities and incremental consent
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          "^Verified account rows retain|^An existing identity batches|^Existing Google declarations gain|^One consent connects|^Incremental consent retains|^Wrong identities denial|^Refresh and changed targets|^Additive identity storage|^Verified subjects group|^Covering grants share|^Separate grants never"
          --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-local-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  host-managed-accounts-cloud:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'host-managed-accounts-cloud')
    runs-on: ${{ vars.BASALT_CI_RUNNER_HEAVY || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated Cloud test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify the private OAuth transport and hosted placement
        working-directory: .upstream
        run: >-
          bun run e2e:cloud --test-name
          "^Hosted identity reuse preserves personal placement|^OAuth clients authenticate to services|^OAuth classifies token and callback error responses|^Agents learn safely when an MCP server needs them to write the app|^invitation roles cannot grant|^organization admins who manage an app"
          --workers 1
      - name: Verify shared account families and consumer capability refusals
        working-directory: .upstream
        run: >-
          bun run e2e:local --test-name
          '^A declared family reuses|^Consumer capability requirements block|^Family metadata preserves retained|^Exact account reuse preserves each app'
          --workers 1
      - name: Verify one saved provider account supplies two native pools
        working-directory: .upstream
        run: bun run e2e:self-host --test-name '^One OpenAI saved account supplies|^Saved-account rows retain exact IDs|^Hosted saved sign-in completion retries' --workers 1
      - name: Verify account mirror retries and generations through the SDK HTTP host
        working-directory: .upstream
        run: bunx vitest run --config e2e/account-mirrors.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-managed-accounts-cloud-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  google-account-recovery:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'google-account-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Prepare the pinned Google recovery runtime
        timeout-minutes: 2
        run: npm run prepare:upstream
      - name: Build the isolated Google recovery test assets
        timeout-minutes: 2
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the Google recovery browser engine
        timeout-minutes: 1
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify Google recovery through signed Cloud operations
        timeout-minutes: 6
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
          BASALT_E2E_PREBOOT_BINDING: "alternate"
        run: bun run e2e:cloud --test-name '^(Google|Atlassian) identity recovery (binds exact grants|refuses a plan after)' --workers 1
      - name: Upload Google recovery evidence
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: google-account-recovery-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  oauth-account-regressions:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'oauth-account-regressions')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated OAuth test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify account deletion against concurrent OAuth renewal
        timeout-minutes: 5
        run: node scripts/oauth-removal-tests/prove.ts
      - name: Verify discarded rotated refresh revocation after account deletion
        timeout-minutes: 5
        run: node scripts/oauth-discard-tests/prove.ts
      - name: Keep OAuth naming independent of account reads and health
        working-directory: .upstream
        run: bun run e2e:self-host --test-name 'OAuth naming stays editable while account details and health are pending'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-account-regressions-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  pool-account-recovery:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'pool-account-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated recovery test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify recovery through Cloud's real provisioning queue
        timeout-minutes: 5
        working-directory: .upstream
        env:
          BASALT_E2E_POOL_SETUP: "1"
        run: bun run e2e:cloud --test-name '^Cloud pool account recovery queues' --manual-cron --workers 1
      - name: Verify atomic pool setup with ordinary cron triggers
        timeout-minutes: 5
        working-directory: .upstream
        env:
          BASALT_E2E_POOL_SETUP: "1"
        run: bun run e2e:cloud --test-name '^Cloud pool account recovery publishes' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-account-recovery-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/server.log
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  sso-service-binding:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'sso-service-binding')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated SSO test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the SSO journeys
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify OIDC and SAML through the private service binding
        working-directory: .upstream
        run: bun run e2e:cloud --test-name '^Cloud SSO (OIDC protocol|SAML)' --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sso-service-binding-e2e
          path: |
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/sso-idp.log
            .upstream/.local/e2e/**/report/**
          if-no-files-found: warn
  production-ops:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'production-ops')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated production operation test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenarios' browser engine
        working-directory: .upstream
        run: bunx playwright install --with-deps chromium
      - name: Verify runtime database binding with one isolated restart
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
        run: node ../scripts/ci/run-e2e.ts --job production-ops -- bun run e2e:cloud --test-name '^Cloud production operations bind' --workers 1
      - name: Verify encrypted production operation reads and backup refusal boundaries
        working-directory: .upstream
        env:
          BASALT_E2E_PRODUCTION_OPS: "1"
