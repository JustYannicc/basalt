    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'dashboard-batch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Build the isolated self-host test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the scenario's browser engine
        uses: ./.github/actions/setup-browser
      - name: Check Google BYO OAuth through the real self-host flow
        working-directory: .upstream
        # Each case starts its own compiler, server and browser; keep their startup bursts apart.
        run: bun run e2e:self-host --test-name "$(node ../scripts/ci/e2e-pattern.ts dashboard-batch:google-byo-oauth-through-the-real-self-host-flow)" --workers 1
      - name: Prove shared Google Admin OAuth selection through the pinned server
        env:
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: |
          mkdir -p .generated/google-admin-snapshots
          curl --fail --silent --show-error --location --user-agent 'Mozilla/5.0' https://catalog.executor.sh/apps/google.json \
            --output .generated/google-admin-snapshots/google.json
          curl --fail --silent --show-error --location --user-agent 'Mozilla/5.0' https://catalog.executor.sh/apps/google-admin.json \
            --output .generated/google-admin-snapshots/google-admin.json
          candidate_sha="$(git rev-parse HEAD)"
          bun scripts/connectors-tests/google-admin.mjs \
            . \
            .generated/google-admin-snapshots \
            .generated/google-admin-proof \
            "$candidate_sha" \
            "$BASE_SHA"
