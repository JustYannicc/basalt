        with:
          prepare-upstream: "true"

  # `fast` and `fast-units` need no selection, so they start with the Check: each resolves the
  # comparison commit and the lane itself, with select's step and select's lane function
  # (scripts/ci/lane.ts). The aggregate requires each of them to report select's lane and base, so
  # main moving the merge-base mid-Check fails it rather than running another base's tests.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets a re-run read whether select ran again in its attempt.
    permissions:
      actions: read
      contents: read
    env:
      # Bytecode inside the pool context changes its reviewed publication identity.
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      lane_base: ${{ steps.lane.outputs.lane_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      # Warms a cold cache itself: it starts beside select rather than after select's warm.
      - uses: ./.github/actions/desktop-release-assets
        with:
          warm: "true"
      # A re-run that carries select over compares with the commit select recorded; main may have
      # moved the merge-base since (scripts/ci/rerun-selection.ts). Only then is there a record to
      # download, so other re-runs show no missing-artifact error.
      - name: Check whether select carries over into this re-run
        id: carried
        if: github.run_attempt > 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/rerun-selection.ts
      - name: Download the selection select recorded
        if: github.run_attempt > 1 && steps.carried.outputs.carried == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: ${{ runner.temp }}/ci-selection
      - name: Take select's comparison commit
        id: rerun
        if: github.run_attempt > 1 && steps.carried.outputs.carried == 'true'
        run: node scripts/ci/rerun-selection.ts base
      - name: Resolve the comparison commit
        id: comparison
        env:
          RECORDED_BASE: ${{ steps.rerun.outputs.base_sha }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BATCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -n "${RECORDED_BASE:-}" ]; then
            # A re-run whose select carried over compares with the commit select recorded.
            base="$RECORDED_BASE"
          elif [ "$PULL_REQUEST" = true ] || [ "$BATCH_PUSH" = true ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            target="${BASE_REF:-main}"
            git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"
            base="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$target")"
          fi
          base="$(git rev-parse --verify "$base^{commit}")"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check container Python names and imports
        run: |
          python3 -m venv "$RUNNER_TEMP/container-python-lint"
          "$RUNNER_TEMP/container-python-lint/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir ruff==0.16.1
          "$RUNNER_TEMP/container-python-lint/bin/ruff" check --isolated --select F \
            --config 'include = ["*.py"]' --target-version py312 \
            --no-respect-gitignore --no-cache containers
      - run: npm run prepare:upstream
      - name: Resolve the lane select chooses
        id: lane
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_SUITE: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'batch/') && github.event.pull_request.head.repo.full_name != github.repository) || (!startsWith(github.head_ref, 'batch/') && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'release-update'))) }}
          AFFECTED_LANE: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'batch/') }}
        run: node scripts/ci/lane.ts
      - name: Verify every adopted test declares its plan and CI job
        run: bun scripts/ci/check-plans.ts
      - name: Reject e2e tests and checks without CI coverage
        run: bun scripts/ci/check-e2e-coverage.ts
      # Builds the pinned source on a cold cache: no job warms it first any more.
      - uses: ./.github/actions/setup-actionlint
      - name: Check workflow syntax
        run: node scripts/ci/check-workflows.ts
      - name: Prove failed E2E evidence reaches artifact inputs
        env:
          BASALT_E2E_UPLOAD_PROOF_DIR: .generated/ci-evidence-proof
        run: node --test scripts/ci/collect-e2e-evidence.test.mjs scripts/ci/declared-e2e-evidence.test.mjs
      - name: Upload forced-failure evidence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declared-e2e-failure-evidence-proof
          path: .generated/ci-evidence-proof
          include-hidden-files: true
          if-no-files-found: error
      - name: Prove connector failure diagnostics reach artifact inputs
        env:
          BASALT_CONNECTOR_UPLOAD_PROOF_DIR: .generated/ci-connector-evidence-proof
        run: node --test scripts/ci/connector-evidence.test.mjs
      - name: Upload sanitized connector failure proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-failure-evidence-proof
          path: .generated/ci-connector-evidence-proof
          include-hidden-files: true
          if-no-files-found: error
      - name: Check app conventions
        run: |
          node scripts/app-lint/prepare-host.mjs
          npm run lint:apps
          npm run check:app-lint
      - name: Architecture format and validation
        run: |
          npm run architecture:format
          npm run architecture:validate
      - name: Architecture model and code references
        run: |
          npm run architecture:model
          npm run architecture:typecheck
      - name: Check the prepared batch inputs and root types
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/batch-preflight.ts
      - name: Check app source snapshots against verified pins and hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: node scripts/catalog-sources.ts --check --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check catalog OAuth decisions against the committed metadata snapshots
        run: node scripts/check-catalog-oauth.ts
      - name: Check reviewed catalog POST reads still take their reviewed inputs
        run: node scripts/check-catalog-read-kinds.ts
      - name: Verify social sign-in and admin security boundaries
        run: |
          bun run --cwd .upstream patches:check
          bun run --cwd .upstream auth:security
      # Specs whose plans name only this job run here: in the full suite, or when the lane's
      # change reaches one of these configs. All four take about 20 seconds together.
      - name: Verify Cloud startup diagnostics and app listeners
        if: steps.lane.outputs.full_suite == 'true' || steps.lane.outputs.fast_configs != '[]'
        working-directory: .upstream
        run: |
          bunx vitest run --config e2e/alchemy-dev-output.config.ts
          bunx vitest run --config e2e/cloud-app-listener.config.ts
          bunx vitest run --config e2e/cloud-postgres.config.ts
          bunx vitest run --config e2e/emulator-failures.config.ts
      - name: Check the pool acceptance runner
        run: node --test scripts/pool-acceptance/*.test.ts
      - name: Check the provider table against the pinned pool backend
        run: npm run check:providers
      - name: Check the pool bootstrap
        run: python3 -m unittest containers.pool.test_dispatch_signals containers.pool.test_quota_signals containers.pool.test_bootstrap containers.pool.test_sources containers.pool.test_release_cache containers.pool.test_output_privacy containers.pool.test_native_policy containers.pool.test_policy_diagnostic containers.pool.test_policy_check containers.pool.test_recovery containers.pool.test_recovery_supervisor containers.pool.test_service_health containers.pool.test_recovery_readiness containers.pool.test_launch_readiness containers.pool.test_recovery_http containers.pool.test_recovery_cleanup containers.pool.test_capture_recovery containers.pool.test_billing_policy containers.pool.test_usage_write_signals containers.pool.test_home_peer containers.pool.test_database_distance containers.pool.test_container_ends containers.pool.test_safe_stop containers.pool.test_resume_layer containers.pool.test_readiness_lapse_flip
      - name: Check the route gateway
        run: python3 -m unittest discover -s containers/route-gateway -t containers/route-gateway
      - name: Prove the output regression catches the previous image source
        run: |
          mkdir -p "$RUNNER_TEMP/pool-output-baseline"
          git archive b4ffc98c586aa8c6700fe95bd8a87aac0cc35847 containers/pool | tar -x -C "$RUNNER_TEMP/pool-output-baseline"
          cp containers/pool/test_output_privacy.py "$RUNNER_TEMP/pool-output-baseline/containers/pool/"
          cd "$RUNNER_TEMP/pool-output-baseline"
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_startup_errors_are_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_post_readiness_runtime_failure_is_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_http_handler_failure_cannot_print_response_token_or_address",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or result.errors or len(result.failures) != 3:
              raise SystemExit("Expected exactly three privacy assertion failures against the previous image source")
          print("All three previous-image output leaks reproduced; no setup errors")
          PY
      - name: Check carried host protocol records
        working-directory: .upstream
        run: bun run apps:protocols
      - name: Prove release updates, broken patches, rollback and preview cleanup gates
        run: |
          npm run check:releases
          npm run prove:releases
          npm run check:preview-auth
      - name: Prepare generated inputs for fitness and source typechecking
        run: bun run --cwd .upstream/apps/hosted/cloud framework:build
      - name: Architecture deployment generation
        if: steps.lane.outputs.full_suite == 'true'
        run: |
          npm run architecture:deployment
          git diff --exit-code -- architecture/gen
          test -z "$(git ls-files --others --exclude-standard architecture/gen)"
          npm run architecture:validate
      - name: Architecture fitness functions
        env:
          ARCHITECTURE_BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
        run: npm run architecture:test
      - name: Typecheck the patched upstream the way upstream checks itself
        if: steps.lane.outputs.full_suite == 'true'
        run: npm run typecheck:upstream

  # The owned unit tests fast's lane selects, split by scripts/ci/unit-tests.ts into one leg per
  # matrix row: each test file runs in exactly one leg. The suite took 6.8 of fast's 12.9 hosted
  # minutes; each leg pays preparation again (1.1 minutes) to start with the Check.
  fast-units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets a re-run read whether select ran again in its attempt.
    permissions:
      actions: read
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    # One output per leg: a matrix job's legs merge outputs by name (unitLegs in scripts/ci/gate.ts).
    outputs:
      leg_1: ${{ matrix.leg == 1 && steps.lane.outputs.lane_base || '' }}
      leg_2: ${{ matrix.leg == 2 && steps.lane.outputs.lane_base || '' }}
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Check whether select carries over into this re-run
        id: carried
        if: github.run_attempt > 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/rerun-selection.ts
      - name: Download the selection select recorded
        if: github.run_attempt > 1 && steps.carried.outputs.carried == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: ${{ runner.temp }}/ci-selection
      - name: Take select's comparison commit
        id: rerun
        if: github.run_attempt > 1 && steps.carried.outputs.carried == 'true'
        run: node scripts/ci/rerun-selection.ts base
      - name: Resolve the comparison commit
        id: comparison
        env:
          RECORDED_BASE: ${{ steps.rerun.outputs.base_sha }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BATCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -n "${RECORDED_BASE:-}" ]; then
            # A re-run whose select carried over compares with the commit select recorded.
            base="$RECORDED_BASE"
          elif [ "$PULL_REQUEST" = true ] || [ "$BATCH_PUSH" = true ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            target="${BASE_REF:-main}"
            git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"
            base="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$target")"
          fi
          base="$(git rev-parse --verify "$base^{commit}")"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - run: npm run prepare:upstream
      - name: Resolve the lane select chooses
        id: lane
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_SUITE: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'batch/') && github.event.pull_request.head.repo.full_name != github.repository) || (!startsWith(github.head_ref, 'batch/') && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'release-update'))) }}
          AFFECTED_LANE: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'batch/') }}
        run: node scripts/ci/lane.ts
      - name: Run focused owned unit tests
        timeout-minutes: 15
        if: steps.lane.outputs.full_suite != 'true'
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNIT_SHARD: ${{ matrix.leg }}/${{ strategy.job-total }}
        run: node scripts/ci/unit-tests.ts
      - name: Run the complete owned unit suite
        timeout-minutes: 15
        if: steps.lane.outputs.full_suite == 'true'
        env:
          UNIT_SHARD: ${{ matrix.leg }}/${{ strategy.job-total }}
        run: node scripts/ci/unit-tests.ts --all

  pool-runtime:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'pool-runtime')
    runs-on: ubuntu-latest
    # The longest job of a full Check, in shards that each build the candidate image. The
    # compatibility shard also loads the frozen compatibility images and runs the files that read
    # them plus the one-off proofs; the contracts shard runs every other pool test file, split in
    # parts by scripts/ci/pool-test-shard.ts (its step took 11.5 of the job's 21.6 hosted minutes).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: contracts
            part: 1/2
          - shard: contracts
            part: 2/2
          - shard: compatibility
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
          POSTGRES_USER: fixture_root
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432, 6432:6432]
        options: >-
          --health-cmd "pg_isready -U fixture_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - name: Prove committed change locks and account source read contention on PostgreSQL
        if: matrix.shard == 'compatibility'
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
        run: node --experimental-transform-types --test --test-concurrency=1 scripts/upstream-tests/account-change-postgres.test.ts scripts/upstream-tests/change-serializable-postgres.test.ts scripts/upstream-tests/account-source-read-locks-postgres.test.ts
      - name: Stage the pinned app release for provider fixtures
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Free runner disk before pool builds
        run: |
          echo "Runner disk before cleanup (bytes)"
          df -B1 /
          # The builds peak near 15 GB; deleting the preinstalled SDKs takes over a minute, so only small disks pay it.
          if [ "$(df --output=avail -B1G / | tail -n 1 | tr -d ' ')" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          fi
          docker builder prune --all --force
          echo "Runner disk after cleanup (bytes)"
          df -B1 /
      - name: Load the compatibility images
        if: matrix.shard == 'compatibility'
        uses: ./.github/actions/pool-compatibility-images
      - name: Build the pinned pool image
        run: |
          echo "Runner disk before compatibility build cache cleanup (bytes)"
          df -B1 /
          docker builder prune --all --force
          echo "Runner disk before candidate build (bytes)"
          df -B1 /
          bash scripts/ci/pool-image-build.sh --target runtime --tag basalt-1409-pool:test containers/pool
      - name: Allow pool fixture HTTP from Docker bridges on self-hosted runners
        if: runner.environment == 'self-hosted'
        run: |
          sudo iptables -I INPUT 1 -i docker0 -p tcp -j ACCEPT
          sudo iptables -I INPUT 1 -i br+ -p tcp -j ACCEPT
      - name: Verify containers can reach the host fixture listeners
        run: node scripts/ci/check-docker-host.mjs basalt-1409-pool:test
      - name: Start the isolated transaction pooler
        if: matrix.shard == 'compatibility'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
        run: |
          docker exec "$POSTGRES_CONTAINER" apk add --no-cache pgbouncer=1.25.1-r0
          docker exec -i "$POSTGRES_CONTAINER" sh -c 'cat > /tmp/budget-pgbouncer.ini' <<'CONFIG'
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr=0.0.0.0
          listen_port=6432
          auth_type=trust
          auth_file=/tmp/budget-users.txt
          admin_users=fixture_root
          pool_mode=transaction
          default_pool_size=5
          max_db_connections=5
          max_client_conn=400
          max_prepared_statements=200
          ignore_startup_parameters=extra_float_digits
          server_lifetime=60
          server_idle_timeout=15
          logfile=/tmp/budget-pgbouncer.log
          pidfile=/tmp/budget-pgbouncer.pid
          CONFIG
          docker exec -i "$POSTGRES_CONTAINER" sh -c 'cat > /tmp/budget-users.txt; chown postgres /tmp/budget-pgbouncer.ini /tmp/budget-users.txt' <<'USERS'
          "fixture_root" "fixture-only"
          "budget_a" "fixture-only"
          "budget_b" "fixture-only"
          USERS
          docker exec --user postgres "$POSTGRES_CONTAINER" pgbouncer -d /tmp/budget-pgbouncer.ini
          node scripts/pool-tests/database-budget/setup.ts
      - name: Verify Home connection limits and concurrent liveness on Postgres
        if: matrix.shard == 'compatibility'
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
        run: |
          docker build --target home-db-pool-tests --tag basalt-home-db-pool:test containers/pool
          docker run --rm --network host -e HOME_TEST_POSTGRES_DSN=postgresql://fixture_root:fixture-only@localhost:5432/postgres -e HOME_TEST_POOLED_DSN=postgresql://budget_a:fixture-only@localhost:6432/budget0314_compat basalt-home-db-pool:test
          proof=$(docker create basalt-home-db-pool:test)
          docker cp "$proof:/out/home-budget-client" "$RUNNER_TEMP/home-budget-client"
          docker rm "$proof"
          node scripts/pool-tests/database-budget/setup.ts cleanup
      - name: Prove the shared budget across independent Home processes
        if: matrix.shard == 'compatibility'
        run: node --test --test-concurrency=1 scripts/pool-tests/shared-database-budget.test.ts scripts/pool-tests/database-direct-control.test.ts scripts/pool-tests/database-retirement.test.ts scripts/pool-tests/database-verification.test.ts
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
          POOL_TEST_POOLED_URL: postgresql://fixture_root:fixture-only@localhost:6432/postgres
          POOL_TEST_HOME_BUDGET_CLIENT: ${{ runner.temp }}/home-budget-client
      - name: Compile and serve the SQLite upload worker assets
        if: matrix.shard == 'contracts'
        run: node scripts/pool-tests/sqlite-compiler-proof.mjs "${{ runner.temp }}/sqlite-upload-compiled"
      - name: Check the pool runtime and database contracts
        run: |
          list=$(node scripts/ci/pool-test-shard.ts "$POOL_TEST_SHARD" "$POOL_TEST_PART")
          mapfile -t files <<< "$list"
          node --test --test-concurrency=1 "${files[@]}"
        env:
          POOL_TEST_SHARD: ${{ matrix.shard }}
          POOL_TEST_PART: ${{ matrix.part || '1/1' }}
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
          SQLITE_COMPILED_OUTPUT: ${{ runner.temp }}/sqlite-upload-compiled
          POOL_TEST_IMAGE: basalt-1409-pool:test
          POOL_TEST_LEGACY_IMAGE: basalt-1409-pool:privacy-legacy
          POOL_TEST_USAGE_PRIVACY_IMAGE: basalt-1409-pool:usage-privacy-baseline
      - name: Set up the import flow's browser
        if: matrix.shard == 'compatibility'
        uses: ./.github/actions/setup-browser
      - name: Verify usage imports through the pool app and database
        if: matrix.shard == 'compatibility'
        run: node --test scripts/pool-ui-tests/usage-import.test.mjs
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
      - name: Release pool build disk
        if: always()
        run: |
          echo "Runner disk before pool cleanup (bytes)"
          df -B1 /
          for image in basalt-1409-pool:test basalt-1409-pool:privacy-legacy basalt-1409-pool:usage-privacy-baseline basalt-home-db-pool:test; do
            if docker image inspect "$image" > /dev/null 2>&1; then
              docker image rm "$image"
            fi
          done
          docker builder prune --all --force
          echo "Runner disk after pool cleanup (bytes)"
          df -B1 /

  production-build:
