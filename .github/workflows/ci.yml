        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: declared-e2e-failure-evidence-proof
          path: .generated/ci-evidence-proof
          include-hidden-files: true
          if-no-files-found: error
      - name: Prove connector failure diagnostics reach artifact inputs
        env:
          BASALT_CONNECTOR_UPLOAD_PROOF_DIR: .generated/ci-connector-evidence-proof
        run: node --test scripts/ci/connector-evidence.test.mjs
      - name: Upload sanitized connector failure proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-failure-evidence-proof
          path: .generated/ci-connector-evidence-proof
          include-hidden-files: true
          if-no-files-found: error
      - name: Check app conventions
        run: |
          node scripts/app-lint/prepare-host.mjs
          npm run lint:apps
          npm run check:app-lint
      - name: Architecture format and validation
        run: |
          npm run architecture:format
          npm run architecture:validate
      - name: Architecture model and code references
        run: |
          npm run architecture:model
          npm run architecture:typecheck
      - name: Check the prepared batch inputs and root types
        env:
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/batch-preflight.ts
      - name: Run focused owned unit tests
        if: needs.select.outputs.full_suite != 'true'
        env:
          BASE_SHA: ${{ needs.select.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/unit-tests.ts
      - name: Run the complete owned unit suite
        if: needs.select.outputs.full_suite == 'true'
        run: npm run check
      - name: Check app source snapshots against their separate repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog-sources.ts --check
      - name: Check every catalog OAuth method has a reviewed connection path
        run: node scripts/check-catalog-oauth.ts
      - name: Verify social sign-in and admin security boundaries
        run: |
          bun run --cwd .upstream patches:check
          bun run --cwd .upstream auth:security
      - name: Verify Cloud startup diagnostics and app listeners
        if: needs.select.outputs.full_suite == 'true'
        working-directory: .upstream
        run: |
          bunx vitest run --config e2e/alchemy-dev-output.config.ts
          bunx vitest run --config e2e/cloud-app-listener.config.ts
          bunx vitest run --config e2e/emulator-failures.config.ts
      - name: Check the pool acceptance runner
        run: node --test scripts/pool-acceptance/*.test.ts
      - name: Check the provider table against the pinned pool backend
        run: npm run check:providers
      - name: Check the pool bootstrap
        run: python3 -m unittest containers.pool.test_bootstrap containers.pool.test_sources containers.pool.test_output_privacy containers.pool.test_native_policy containers.pool.test_recovery containers.pool.test_recovery_supervisor containers.pool.test_recovery_readiness containers.pool.test_recovery_http containers.pool.test_recovery_cleanup containers.pool.test_capture_recovery containers.pool.test_billing_policy
      - name: Prove the output regression catches the previous image source
        run: |
          mkdir -p "$RUNNER_TEMP/pool-output-baseline"
          git archive b4ffc98c586aa8c6700fe95bd8a87aac0cc35847 containers/pool | tar -x -C "$RUNNER_TEMP/pool-output-baseline"
          cp containers/pool/test_output_privacy.py "$RUNNER_TEMP/pool-output-baseline/containers/pool/"
          cd "$RUNNER_TEMP/pool-output-baseline"
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_startup_errors_are_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_supervisor_post_readiness_runtime_failure_is_closed",
              "containers.pool.test_output_privacy.OutputPrivacyTests.test_http_handler_failure_cannot_print_response_token_or_address",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 3 or result.errors or len(result.failures) != 3:
              raise SystemExit("Expected exactly three privacy assertion failures against the previous image source")
          print("All three previous-image output leaks reproduced; no setup errors")
          PY
      - name: Check carried host protocol records
        working-directory: .upstream
        run: bun run apps:protocols
      - name: Prove release updates, broken patches, rollback and preview cleanup gates
        run: |
          npm run check:releases
          npm run prove:releases
          npm run check:preview-auth
      - name: Prepare generated inputs for fitness and source typechecking
        run: bun run --cwd .upstream/apps/hosted/cloud framework:build
      - name: Architecture deployment generation
        if: needs.select.outputs.full_suite == 'true'
        run: |
          npm run architecture:deployment
          git diff --exit-code -- architecture/gen
          test -z "$(git ls-files --others --exclude-standard architecture/gen)"
          npm run architecture:validate
      - name: Architecture fitness functions
        env:
          ARCHITECTURE_BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: npm run architecture:test
      - name: Typecheck the patched upstream the way upstream checks itself
        if: needs.select.outputs.full_suite == 'true'
        run: npm run typecheck:upstream

  pool-runtime:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'pool-runtime')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
          POSTGRES_USER: fixture_root
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432, 6432:6432]
        options: >-
          --health-cmd "pg_isready -U fixture_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Stage the pinned app release for provider fixtures
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Free runner disk before pool builds
        run: |
          echo "Runner disk before cleanup (bytes)"
          df -B1 /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          docker builder prune --all --force
          echo "Runner disk after cleanup (bytes)"
          df -B1 /
      - name: Build the pinned pool image
        run: |
          mkdir -p "$RUNNER_TEMP/pool-usage-privacy-baseline"
          git archive b35314687e8972f64d7c1c3c73a1492a50fb7bac containers/pool | tar -x -C "$RUNNER_TEMP/pool-usage-privacy-baseline"
          docker build --target runtime --tag basalt-1409-pool:usage-privacy-baseline "$RUNNER_TEMP/pool-usage-privacy-baseline/containers/pool"
          docker build --target legacy-runtime --tag basalt-1409-pool:privacy-legacy "$RUNNER_TEMP/pool-usage-privacy-baseline/containers/pool"
          echo "Runner disk before compatibility build cache cleanup (bytes)"
          df -B1 /
          docker builder prune --all --force
          docker image inspect basalt-1409-pool:usage-privacy-baseline basalt-1409-pool:privacy-legacy > /dev/null
          echo "Runner disk before candidate build (bytes)"
          df -B1 /
          docker build --target runtime --tag basalt-1409-pool:test containers/pool
      - name: Start the isolated transaction pooler
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
        run: |
          docker exec "$POSTGRES_CONTAINER" apk add --no-cache pgbouncer=1.25.1-r0
          docker exec -i "$POSTGRES_CONTAINER" sh -c 'cat > /tmp/budget-pgbouncer.ini' <<'CONFIG'
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr=0.0.0.0
          listen_port=6432
          auth_type=trust
          auth_file=/tmp/budget-users.txt
          admin_users=fixture_root
          pool_mode=transaction
          default_pool_size=5
          max_db_connections=5
          max_client_conn=400
          max_prepared_statements=200
          ignore_startup_parameters=extra_float_digits
          server_lifetime=60
          server_idle_timeout=15
          logfile=/tmp/budget-pgbouncer.log
          pidfile=/tmp/budget-pgbouncer.pid
          CONFIG
          docker exec -i "$POSTGRES_CONTAINER" sh -c 'cat > /tmp/budget-users.txt; chown postgres /tmp/budget-pgbouncer.ini /tmp/budget-users.txt' <<'USERS'
          "fixture_root" "fixture-only"
          "budget_a" "fixture-only"
          "budget_b" "fixture-only"
          USERS
          docker exec --user postgres "$POSTGRES_CONTAINER" pgbouncer -d /tmp/budget-pgbouncer.ini
          node scripts/pool-tests/database-budget/setup.ts
      - name: Verify Home connection limits and concurrent liveness on Postgres
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
        run: |
          docker build --target home-db-pool-tests --tag basalt-home-db-pool:test containers/pool
          docker run --rm --network host -e HOME_TEST_POSTGRES_DSN=postgresql://fixture_root:fixture-only@localhost:5432/postgres -e HOME_TEST_POOLED_DSN=postgresql://budget_a:fixture-only@localhost:6432/budget0314_compat basalt-home-db-pool:test
          proof=$(docker create basalt-home-db-pool:test)
          docker cp "$proof:/out/home-budget-client" "$RUNNER_TEMP/home-budget-client"
          docker rm "$proof"
          node scripts/pool-tests/database-budget/setup.ts cleanup
      - name: Prove the shared budget across independent Home processes
        run: node --test --test-concurrency=1 scripts/pool-tests/shared-database-budget.test.ts scripts/pool-tests/database-direct-control.test.ts scripts/pool-tests/database-retirement.test.ts scripts/pool-tests/database-verification.test.ts
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
          POOL_TEST_POOLED_URL: postgresql://fixture_root:fixture-only@localhost:6432/postgres
          POOL_TEST_HOME_BUDGET_CLIENT: ${{ runner.temp }}/home-budget-client
      - name: Check the pool runtime and database contracts
        run: node --test --test-concurrency=1 scripts/pool-tests/*.test.ts
        env:
          POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
          POOL_TEST_IMAGE: basalt-1409-pool:test
          POOL_TEST_LEGACY_IMAGE: basalt-1409-pool:privacy-legacy
          POOL_TEST_USAGE_PRIVACY_IMAGE: basalt-1409-pool:usage-privacy-baseline
      - name: Release pool build disk
        if: always()
        run: |
          echo "Runner disk before pool cleanup (bytes)"
          df -B1 /
          for image in basalt-1409-pool:test basalt-1409-pool:privacy-legacy basalt-1409-pool:usage-privacy-baseline basalt-home-db-pool:test; do
            if docker image inspect "$image" > /dev/null 2>&1; then
              docker image rm "$image"
            fi
          done
          docker builder prune --all --force
          echo "Runner disk after pool cleanup (bytes)"
          df -B1 /

  production-build:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'production-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: npm run build
      - run: npm run check:build
      - name: Check every Worker's startup CPU and size against Cloudflare's limits
        run: npm run check:startup
      - name: Generate the architecture model for typechecking
        run: npm run architecture:model
      - run: npm run typecheck

  docs-build:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'docs-build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build documentation without Google font requests
        run: node scripts/docs-fonts/check.ts

  upstream-contracts:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'upstream-contracts')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: fixture_root
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture_root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - run: npm run check:upstream
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres

  check:
    name: ${{ needs.select.outputs.full_suite == 'true' && 'check' || 'check (fast-only)' }}
    needs:
      [
        select,
        fast,
        cpa-pipeline,
        client-connection,
        client-mobile,
        client-desktop,
        client-native-product,
        slack-health,
        catalog-compat,
        host-managed-accounts,
        host-managed-accounts-pool,
        host-managed-accounts-local,
        host-managed-accounts-cloud,
        google-account-recovery,
        google-account-diagnostics,
        oauth-account-regressions,
        pool-account-recovery,
        sso-service-binding,
        production-ops,
        production-ops-migrations,
        production-ops-identity,
        compiler-diagnostics,
        human-in-the-loop,
        human-in-the-loop-cloud,
        access-editor-reads,
        contributed-accounts,
        contributed-account-recipes,
        personal-data-reporting,
        pool-inventory,
        dashboard-batch,
        aws-connectors,
        gitlab-connectors,
        mcp-apps,
        pool-runtime,
        upstream-image,
        production-build,
        docs-build,
        upstream-contracts,
        declared-self-host,
        declared-local,
        declared-cloud,
        account-acquisition,
        account-usage,
        vercel-sign-in,
        elevenlabs-sign-in,
        boat-bundle,
        boat-check,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Require every selected job and every fast check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_FULL_SUITE: ${{ needs.select.outputs.full_suite }}
          CI_JOBS: ${{ needs.select.outputs.jobs }}
          CI_BOAT_JOBS: ${{ needs.select.outputs.boat_jobs }}
        run: node scripts/ci/gate.ts
      - name: Capture the checked pull request merge result
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        run: node scripts/release-merge/check-receipt.ts
      - uses: actions/upload-artifact@v4
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-updates/') &&
          contains(github.event.pull_request.labels.*.name, 'release-update')
        with:
          name: ${{ format('release-check-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.run_attempt) }}
          path: ${{ runner.temp }}/check-receipt.json
          if-no-files-found: error
          retention-days: 1

  account-acquisition:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'account-acquisition')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated account test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account tests
        uses: ./.github/actions/setup-browser
      - name: Verify reusable acquisition, health and retained account compatibility
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:reusable-acquisition-health-and-retained-account-compatibility)"
          --workers 1
      - name: Verify local account lifetime and observation provenance
        working-directory: .upstream
        run: bun run e2e:local --test-name "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:local-account-lifetime-and-observation-provenance)" --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-acquisition-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn

  account-usage:
    needs: select
    if: contains(fromJSON(needs.select.outputs.hosted_jobs), 'account-usage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - run: npm run prepare:upstream
      - name: Build the isolated account test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install Chromium for the account tests
        uses: ./.github/actions/setup-browser
      - name: Verify account usage rows and cells
        working-directory: .upstream
        run: >-
          bun run e2e:self-host --test-name
          "$(node ../scripts/ci/e2e-pattern.ts account-acquisition:account-usage-rows-and-cells)"
          --workers 1
      - name: Collect bounded E2E evidence
        if: always()
        run: |
          node --test scripts/ci/collect-e2e-evidence.test.mjs
          node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-usage-e2e
          path: ${{ runner.temp }}/basalt-e2e-evidence
          include-hidden-files: true
          if-no-files-found: warn

  boat-bundle:
    needs: select
    if: needs.select.outputs.boat_jobs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    runs-on: boat-large
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Retain the pinned E2E Bun
        run: |
          mkdir -p "$RUNNER_TEMP/basalt-bun/1.4.2"
          cp "$(command -v bun)" "$RUNNER_TEMP/basalt-bun/1.4.2/bun"
      - run: bun install --cwd scripts/architecture --frozen-lockfile
      - name: Run every selected suite and retain its resource measurements
        id: bundle
        env:
          BASALT_CI_BOAT_JOBS: ${{ needs.select.outputs.boat_jobs_csv }}
          BASALT_CI_BOAT_SHARD: ${{ matrix.shard }}
          BASALT_CI_BOAT_MAX_PARALLEL: ${{ vars.BASALT_CI_BOAT_MAX_PARALLEL }}
          BASALT_CI_BASE_SHA: ${{ needs.select.outputs.base_sha }}
        run: node scripts/ci-bundles/run.mjs
      - name: Retain bundle evidence and incremental measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-bundle-${{ matrix.shard }}
          path: ${{ runner.temp }}/basalt-boat/output
          include-hidden-files: true
          if-no-files-found: error

  boat-check:
    if: ${{ always() }}
    needs: [select, boat-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every enabled Boat bundle to pass
        env:
          BOAT_ENABLED: ${{ needs.select.outputs.boat_jobs != '[]' }}
          BOAT_RESULT: ${{ needs.boat-bundle.result }}
        run: |
          if [ "$BOAT_ENABLED" = "true" ] && [ "$BOAT_RESULT" != "success" ]; then
            echo "::error::Boat bundles failed, were cancelled, or could not start. Check Boat account capacity and each bundle log."
            exit 1
          fi
