name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, "batch/**"]

# A pull request's full runs and its other runs have separate groups, so a full run a label asks
# for never waits behind the run it replaces; select cancels that one (scripts/ci/cancel-superseded.ts).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || ((startsWith(github.head_ref, 'batch/') && github.event.pull_request.head.repo.full_name != github.repository) || (!startsWith(github.head_ref, 'batch/') && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'release-update')))) && 'pr-full' || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  E2E_BUN_VERSION: 1.4.2
  BASALT_CI_OMIT_RELEASE_DOWNLOADS: "true"

jobs:
  # Decides batch reuse first, then selection. A reused Check selects nothing, so every job that
  # waits for selection skips; `fast` and `fast-units` start with the Check and run in every one.
  select:
    # Reads the box heartbeat, the hosted load and other Checks' box placements for
    # scripts/ci/box-router.ts, finds a reusable batch Check, and cancels this pull request's
    # superseded runs.
    permissions:
      contents: read
      actions: write
      checks: read
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      evidence: ${{ steps.reuse.outputs.evidence }}
      run_id: ${{ steps.reuse.outputs.run_id }}
      head_sha: ${{ steps.reuse.outputs.head_sha }}
      base_sha: ${{ steps.comparison.outputs.base_sha }}
      full_suite: ${{ steps.jobs.outputs.full_suite }}
      lane: ${{ steps.jobs.outputs.lane }}
      # A reused Check skips selection; its empty lists keep the jobs' conditions valid. Any other
      # Check without a selection fails the aggregate.
      jobs: ${{ steps.reuse.outputs.reused == 'true' && '[]' || steps.jobs.outputs.jobs }}
      box_jobs: ${{ steps.reuse.outputs.reused == 'true' && '[]' || steps.jobs.outputs.box_jobs }}
      box_label: ${{ steps.jobs.outputs.box_label }}
      box_floor: ${{ steps.jobs.outputs.box_floor }}
      box_plan: ${{ steps.jobs.outputs.box_plan }}
      matrices: ${{ steps.jobs.outputs.matrices }}
      fast_configs: ${{ steps.jobs.outputs.fast_configs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - name: Find a successful batch Check for this exact tree and workflow
        id: reuse
        timeout-minutes: 5
        run: node scripts/ci/reuse.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup-bun
        if: steps.reuse.outputs.reused != 'true'
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - uses: ./.github/actions/desktop-release-assets
        if: steps.reuse.outputs.reused != 'true'
        with:
          warm: "true"
      - name: Install the workflow and source parsers selection reads with
        if: steps.reuse.outputs.reused != 'true'
        run: bun install --frozen-lockfile --cwd scripts/architecture
      - name: Resolve the comparison commit
        if: steps.reuse.outputs.reused != 'true'
        id: comparison
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BATCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -n "${RECORDED_BASE:-}" ]; then
            # A re-run whose select carried over compares with the commit select recorded.
            base="$RECORDED_BASE"
          elif [ "$PULL_REQUEST" = true ] || [ "$BATCH_PUSH" = true ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            target="${BASE_REF:-main}"
            git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"
            base="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$target")"
          fi
          base="$(git rev-parse --verify "$base^{commit}")"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Select the full suite, the jobs this change reaches, or the fast lane
        if: steps.reuse.outputs.reused != 'true'
        id: jobs
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Box first for main and batch pushes and this repository's pull requests; forks run hosted.
          BOX_SLOTS: ${{ vars.BASALT_CI_BOX_SLOTS }}
          BOX_LABEL: ${{ vars.BASALT_CI_BOX_LABEL }}
          BOX_HEARTBEAT_LABEL: ${{ vars.BASALT_CI_BOX_HEARTBEAT_LABEL }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_TOKEN: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
          FULL_SUITE: ${{ github.event_name != 'pull_request' || (startsWith(github.head_ref, 'batch/') && github.event.pull_request.head.repo.full_name != github.repository) || (!startsWith(github.head_ref, 'batch/') && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'release-update'))) }}
          # This repository's pull requests run the jobs their changes reach. A batch branch's push
          # already runs the full suite on the same head, and forks keep the fast lane.
          AFFECTED_LANE: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'batch/') }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/ci/cancel-superseded.ts
          if [ "$FULL_SUITE" = true ]; then
            node scripts/ci/select-jobs.ts --all
          elif [ "$AFFECTED_LANE" = true ]; then
            node scripts/ci/select-jobs.ts
          else
            node scripts/ci/select-jobs.ts --fast
          fi
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: ci-selection
          path: .generated/ci/selection.json
          include-hidden-files: true
          if-no-files-found: error
  # Watches the jobs this Check queued for the box. A job queued for the box can't move to GitHub's
  # runners, so if the box takes none of them in time (no healthy heartbeat for 5 minutes after
  # box-watch's own probe, or a first-wave job held past its latest start; a second-wave one only
  # while the box runs none of this Check's jobs), box-watch records why and cancels the run;
  # box-rerun.yml re-runs them on GitHub's runners. A re-run is attempt 2, which never routes, so it
  # needs no box-watch.
  box-watch:
    needs: select
    if: github.run_attempt == 1 && needs.select.outputs.box_jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - name: Wait until every box job has started
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOX_LABEL: ${{ needs.select.outputs.box_label }}
          BOX_HEARTBEAT_LABEL: ${{ vars.BASALT_CI_BOX_HEARTBEAT_LABEL }}
          BOX_FLOOR: ${{ needs.select.outputs.box_floor }}
          BOX_PLAN: ${{ needs.select.outputs.box_plan }}
          BOX_WATCH_VERDICT: ${{ runner.temp }}/box-watch-verdict/verdict.json
        run: node scripts/ci/box-watch.ts
      # The verdict is uploaded before the cancel, so box-rerun.yml can prove the cancel was this one.
      - name: Keep the verdict for box-rerun.yml
        if: steps.watch.outputs.cancel == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: box-watch-verdict
          path: ${{ runner.temp }}/box-watch-verdict/verdict.json
          if-no-files-found: error
      - name: Cancel the run so its box jobs can run on GitHub's runners
        if: steps.watch.outputs.cancel == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A 5xx from GitHub is common; without the cancel the stuck box jobs would stay queued.
        run: |
          for attempt in 1 2 3; do
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  # Start order only. Every job outside the long tier (longJobs in scripts/ci/gate.ts) also needs
  # this job, so the long jobs are queued for runners first. A reused Check skips it, and with it
  # every job that waits for it.
  long-started:
    needs: select
    if: needs.select.outputs.reused != 'true'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: "true"
  cpa-pipeline:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the guard comparison commit
        id: comparison
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BATCH_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ "$PULL_REQUEST" = true ] || [ "$BATCH_PUSH" = true ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            target="${BASE_REF:-main}"
            git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"
            base="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$target")"
          fi
          base="$(git rev-parse --verify "$base^{commit}")"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
      - name: Verify CPA updater and pipeline boundary
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BATCH_MODE: ${{ startsWith(github.head_ref, 'batch/') || startsWith(github.ref, 'refs/heads/batch/') }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python3 -m unittest discover -s scripts/cpa-tests
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [ "$MAIN_PUSH" = true ]; then
            args+=(--main-push)
          elif [ "$BATCH_MODE" = true ]; then
            args+=(--batch)
          fi
          python3 scripts/cpa-pipeline-guard.py "${args[@]}"
  client-connection:
    needs: [select, long-started]
    runs-on: ${{ github.run_attempt == 1 && contains(fromJSON(needs.select.outputs.box_jobs), 'client-connection') && needs.select.outputs.box_label || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd src/tunnel --frozen-lockfile
      - run: bun run --cwd clients typecheck
      - name: Verify headless connection through independent processes
        run: bun run --cwd clients test
  client-mobile:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'client-mobile')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/mobile --frozen-lockfile
      - run: bun run --cwd clients/mobile typecheck
      - run: bun run --cwd clients/mobile export:ios
      - run: bun run --cwd clients/mobile export:android
  client-desktop:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'client-desktop')
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/desktop-release-assets
        id: desktop-assets
        with:
          require-hit: ${{ matrix.platform == 'linux' }}
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/desktop --frozen-lockfile
      # The real locked Electron's checksums, which the fast lane can't install.
      - name: Check the builder config carries the locked Electron's checksums
        run: node --test scripts/ci/desktop-builder-config.test.ts
      - run: bun run --cwd clients/desktop typecheck
      - run: bun run --cwd clients/desktop build
      # The generated config is package.json's build plus the locked Electron checksums, so packaging
      # fetches no SHASUMS256.txt. DEBUG logs every @electron/get download, so a fetch that an
      # electron-builder bump brings back fails the step instead of passing silently.
      - name: Package the unsigned development client
        shell: bash
        env:
          DEBUG: "@electron/get*"
        run: |
          set -o pipefail
          node scripts/ci/desktop-release-assets.ts builder-config "$RUNNER_TEMP/electron-builder.json"
          bun run --cwd clients/desktop package:${{ matrix.platform }} --config "$RUNNER_TEMP/electron-builder.json" 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"
          if grep -q SHASUMS256 "$RUNNER_TEMP/electron-builder.log"; then
            echo "::error::electron-builder fetched SHASUMS256.txt instead of using the locked Electron checksums"
            exit 1
          fi
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/basalt-desktop-release-assets
          key: ${{ steps.desktop-assets.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-desktop-${{ matrix.platform }}
          path: clients/desktop/dist-packages/Signalbox-Client-*
          if-no-files-found: error
  client-native-product:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'client-native-product')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: bun install --cwd clients --frozen-lockfile
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - name: Verify native sign-in, renewal and tunnel through the real product
        run: bun e2e/native-client.mjs
      - name: Verify the phone controller with its own hosted grant and tool approvals
        run: bun e2e/native-mobile-product.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-product
          include-hidden-files: true
          path: |
            .generated/native-client-*/result.json
            .generated/native-client-*/failure.txt
            .generated/native-mobile-*/result.json
            .generated/native-mobile-*/failure*.txt
          if-no-files-found: warn
      - name: Retain native product server logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-client-product-server-logs
          include-hidden-files: true
          path: .upstream/.local/testing/**/server.log
          if-no-files-found: warn
  clerk-sign-in:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'clerk-sign-in')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - name: Verify Clerk sign-in, cancellation, refusal and retained API keys
        run: bun e2e/clerk-sign-in.mjs .generated/clerk-sign-in/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs clerk-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clerk-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  workos-sign-in:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'workos-sign-in')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - name: Verify WorkOS sign-in, cancellation, refusal and retained API keys
        run: bun e2e/workos-sign-in.mjs .generated/workos-sign-in/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs workos-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workos-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  gitlab-sign-in:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'gitlab-sign-in')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - name: Verify GitLab MCP sign-in, instance setup guidance and full REST access
        run: bun e2e/gitlab-sign-in.mjs .generated/gitlab-sign-in/ci
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs gitlab-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitlab-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  planetscale-sign-in:
    needs: select
    if: contains(fromJSON(needs.select.outputs.jobs), 'planetscale-sign-in')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - run: npm run prepare:upstream
      - run: bun run --cwd .upstream e2e:prepare
      - uses: ./.github/actions/setup-browser
        timeout-minutes: 5
      - name: Verify fixture certificate trust and the unrelated-certificate rejection
        run: node --test e2e/browser-fixture-certificate-trust.test.ts
      - name: Verify hosted PlanetScale sign-in asks for the full reviewed permissions
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci hosted
      - name: Keep every supported configured PlanetScale grant scope
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci expanded
      - name: Refuse unknown PlanetScale scopes with names-only diagnostics
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci exceeded
      - name: Verify the registered fallback lists only granted tools
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci dcr
      - name: Verify missing scope data preserves legacy tools and reports unknown
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci unknown
      - name: Verify a refused hosted permission is recoverable and saves no account
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci refused
      - name: Verify an unreported hosted grant is refused before account save
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci unreported
      - name: Verify clients without confirmation keep OAuth scope omission behavior
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci rfc
      - name: Verify retained hosted grants renew without replacing saved accounts
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci retained
      - name: Verify retained grants without reported scopes remain unknown
        if: success() || failure()
        run: bun e2e/planetscale-sign-in.mjs .generated/planetscale-sign-in/ci retained-unknown
      - name: Collect sanitized connector diagnostics
        if: always()
        run: node scripts/ci/collect-connector-evidence.mjs planetscale-sign-in "$RUNNER_TEMP/connector-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planetscale-sign-in-evidence
          path: ${{ runner.temp }}/connector-evidence.json
          if-no-files-found: error

  vercel-sign-in:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'vercel-sign-in')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
