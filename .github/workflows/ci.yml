  pool-inventory:
    needs: [select, long-started]
    if: contains(fromJSON(needs.select.outputs.jobs), 'pool-inventory')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Seven independent checks, about 22 minutes in a row; three shards of about 7 minutes each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            checks: [inventory, reset-control]
          - shard: 2
            checks: [recipes, scoped-changes]
          - shard: 3
            checks: [overview, removal-intent, reset-recovery]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.E2E_BUN_VERSION }}
      - name: Install the pinned Motel collector
        uses: ./.github/actions/setup-bun
        # Composite steps inherit this env; the action itself takes no export input.
        env:
          BUN_EXPORT_AS: EXECUTOR_MOTEL_BUN
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/setup-autumn-emulator
      - run: npm run prepare:upstream
      - name: Build the isolated Cloud test assets
        working-directory: .upstream
        run: bun run e2e:prepare
      - name: Install the suite's browser engine
        uses: ./.github/actions/setup-browser
      - name: Verify the Cloud inventory and exact-ID token retirement tooling
        if: contains(matrix.checks, 'inventory')
        working-directory: .upstream
        run: bun run e2e:cloud --test-name "$(node ../scripts/ci/e2e-pattern.ts pool-inventory:the-cloud-inventory-and-exact-id-token-retirement-tooling)" --workers 1
      - name: Verify authorized native pool removal intent
        if: contains(matrix.checks, 'removal-intent')
        run: node e2e/pool-removal-intent.mjs .generated/pool-removal-intent/ci
      - name: Verify native pool recipe journeys with synthetic observations
        if: contains(matrix.checks, 'recipes')
        run: node e2e/pool-recipe-checks.mjs .generated/pool-recipe-checks/ci
      - name: Verify banked reset recovery with a synthetic provider
        if: contains(matrix.checks, 'reset-recovery')
        run: node e2e/pool-reset-checks.mjs .generated/pool-reset-checks/ci
      - name: Verify the banked reset control in a browser with a synthetic provider
        if: contains(matrix.checks, 'reset-control')
        run: node e2e/pool-reset-ui.mjs .generated/pool-reset-ui/ci
      - name: Verify scoped account and pool updates without idle polling
        if: contains(matrix.checks, 'scoped-changes')
        run: node e2e/scoped-change-consumers.mjs .generated/scoped-change-consumers/ci
      - name: Verify the pool usage overview in a browser with synthetic usage
        if: contains(matrix.checks, 'overview')
        run: node e2e/pool-overview-ui.mjs .generated/pool-overview-ui/ci
      - name: Collect bounded E2E evidence with original-run fallback
        if: always()
        run: node scripts/ci/collect-e2e-evidence.mjs .generated/e2e-evidence "$RUNNER_TEMP/basalt-e2e-evidence" .upstream/.local/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: pool-inventory-e2e-${{ matrix.shard }}
          path: |
            .generated/pool-removal-intent/**/report.json
            .generated/pool-removal-intent/**/partial-checks.json
            .generated/pool-removal-intent/**/failure.txt
            .generated/pool-removal-intent/**/runtime-cloud.log
            .generated/pool-removal-intent/**/runtime-diagnostics.json
            .generated/pool-recipe-checks/**/report.json
            .generated/pool-recipe-checks/**/partial-checks.json
            .generated/pool-recipe-checks/**/failure.txt
            .generated/pool-recipe-checks/**/runtime-cloud.log
            .generated/pool-recipe-checks/**/runtime-diagnostics.json
            .generated/pool-reset-checks/**/report.json
            .generated/pool-reset-checks/**/failure.json
            .generated/pool-reset-checks/**/runtime-cloud.log
            .generated/pool-reset-checks/**/runtime-diagnostics.json
            .generated/pool-reset-ui/**/report.json
            .generated/pool-reset-ui/**/failure.json
            .generated/pool-reset-ui/**/*.png
            .generated/pool-reset-ui/**/runtime-diagnostics.json
            .generated/scoped-change-consumers/**/report.json
            .generated/scoped-change-consumers/**/failure.json
            .generated/scoped-change-consumers/**/*.png
            .generated/scoped-change-consumers/**/runtime-diagnostics.json
            .generated/pool-overview-ui/**/report.json
            .generated/pool-overview-ui/**/failure.json
            .generated/pool-overview-ui/**/*.png
            .generated/pool-overview-ui/**/runtime-diagnostics.json
            .upstream/.local/testing/**/cloud-forwarding-errors.ndjson
            .upstream/.local/e2e/**/results.json
            .upstream/.local/e2e/**/cloud.log
            .upstream/.local/e2e/**/report/**
            ${{ runner.temp }}/basalt-e2e-evidence/**/results.json
            ${{ runner.temp }}/basalt-e2e-evidence/**/cloud.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/autumn-emulator.log
            ${{ runner.temp }}/basalt-e2e-evidence/**/report/**
