        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/style.ts
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Check app conventions
        run: |
          node scripts/app-lint/prepare-host.mjs
          npm run lint:apps
          npm run check:app-lint
      - name: Architecture format and validation
        run: |
          npm run architecture:format
          npm run architecture:validate
      - name: Architecture model and code references
        run: |
          npm run architecture:model
          npm run architecture:typecheck
      - run: npm run check
