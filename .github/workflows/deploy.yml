name: Deploy

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write
  # Reads whether the run that owns an unfinished deployment record has completed.
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.name == 'Check' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    outputs:
      manual_required: ${{ steps.report.outputs.manual_required }}
    env:
      # Set this repository variable to stop every release while a manual restore and rollback run.
      PRODUCTION_RELEASE_HOLD: ${{ vars.PRODUCTION_RELEASE_HOLD }}
      RELEASE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_ID }}
      EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID }}
      EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET }}
      ZENDESK_MARKETPLACE_ORGANIZATION_ID: ${{ vars.ZENDESK_MARKETPLACE_ORGANIZATION_ID }}
      ZENDESK_MARKETPLACE_APP_ID: ${{ vars.ZENDESK_MARKETPLACE_APP_ID }}
      EXECUTOR_OAUTH_ZENDESK_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_ID }}
      EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GITLAB_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_ID }}
      EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET }}
      EXECUTOR_OAUTH_MIRO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_ID }}
      EXECUTOR_OAUTH_MIRO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_SECRET }}
      EXECUTOR_OAUTH_ZOHO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_ID }}
      EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET }}
      EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID }}
      EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET }}
      EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID }}
      EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET }}
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      EXECUTOR_ENCRYPTION_KEY: ${{ secrets.EXECUTOR_ENCRYPTION_KEY }}
      MCP_SESSION_KEY_CURRENT: ${{ secrets.MCP_SESSION_KEY_CURRENT }}
      MCP_SESSION_KEY_PREVIOUS: ${{ secrets.MCP_SESSION_KEY_PREVIOUS }}
      APP_DOMAIN_CONTROL_SECRET: ${{ secrets.APP_DOMAIN_CONTROL_SECRET }}
      POOL_APP_SIGNING_KEY: ${{ secrets.POOL_APP_SIGNING_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_OTLP_ENDPOINT: ${{ secrets.SENTRY_OTLP_ENDPOINT }}
      POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      POOL_APP_SIGNING_KEY_PREVIOUS: ${{ secrets.POOL_APP_SIGNING_KEY_PREVIOUS }}
      APP_DOMAIN_CONTROLLER_TOKEN: ${{ secrets.APP_DOMAIN_CONTROLLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate credentials
        run: node --input-type=module -e 'import { deployEnvironment } from "./scripts/environment.ts"; deployEnvironment();'
        env:
          POOL_MANAGEMENT_KEY: ${{ secrets.POOL_MANAGEMENT_KEY }}
      - run: npm run prepare:upstream
      - run: npm run check
      - run: npm run check:releases
      - run: npm run check:preview-auth
      - run: npm run check:upstream
      - run: npm run build
      - run: npm run check:build
      - run: bun install --cwd scripts/architecture --frozen-lockfile
      - run: npm run architecture:model
      - run: npm run typecheck
      - name: Compare the candidate with the last successful production deployment
        id: report
        run: |
          mkdir -p .local
          node scripts/deploy-safety/release.ts report --candidate "$RELEASE_CANDIDATE_SHA" > .local/production-report.json
      - name: Deploy normal releases and restore the previous pin after a failed attempt
        if: steps.report.outputs.manual_required == 'false'
        run: env -u GITHUB_SHA node scripts/deploy-safety/release.ts deploy --candidate "$RELEASE_CANDIDATE_SHA" --report .local/production-report.json --mode automatic
        env:
          POOL_MANAGEMENT_KEY: ${{ secrets.POOL_MANAGEMENT_KEY }}
      - name: Refuse to hand off while the latest production deployment is unresolved
        if: steps.report.outputs.manual_required != 'false' && steps.report.outputs.deployable != 'true'
        run: |
          echo "::error::The latest production deployment is unresolved; reconcile it before another release"
          exit 1

  # No one approves releases, so a database or Workflow-identity release goes straight to the manual path, which takes
  # the backup and runs the drain check before deploying. This job alone may start workflows; it runs no candidate code.
  handoff:
    needs: deploy
    if: needs.deploy.outputs.manual_required != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Hands off this Check's commit even when main has moved on, so a busy main can't defer every release to a
      # newer head. Releases run one at a time in deploy-production. GitHub keeps one pending run per group and a
      # newer one replaces it. That run usually carries a newer commit. When Checks finish out of order it can carry an
      # older one; the replaced commit then waits for the next merge, and Manual release of main never deploys a commit
      # production already contains. Release-update heads are refused here too so Deploy itself fails.
      - name: Hand database and Workflow-identity releases to Manual release of main
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_CANDIDATE_SHA/pulls" --jq '.[].head.ref' | grep -q '^release-updates/'; then
            echo "::error::$RELEASE_CANDIDATE_SHA is a release update; release it through Manual release with its pull request"
            exit 1
          fi
          gh workflow run release-main.yml --repo "$GITHUB_REPOSITORY" --ref main -f candidate="$RELEASE_CANDIDATE_SHA"
