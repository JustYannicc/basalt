name: Manual production rollback

run-name: Recover production release ${{ inputs.release_sha }} (${{ inputs.recovery_mode || 'database-restore' }})

on:
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: Restore database and rebuild old source, or recover exact recorded versions without SQL writes
        required: true
        type: choice
        default: database-restore
        options:
          - database-restore
          - recorded-versions
      release_sha:
        description: Exact 40-character lowercase commit SHA of the production release to recover
        required: true
        type: string
      restored_backup:
        description: Name of the release's protected PlanetScale backup (backupName in its production deployment payload), already restored to production
        required: false
        type: string
      recorded_run:
        description: Failed main release run/attempt, required for recorded-versions (for example 123456/1)
        required: false
        type: string
      recovery_pair_sha256:
        description: SHA-256 of canonical {manifest,receipt} from that release-barrier artifact
        required: false
        type: string
      database_compatible:
        description: Old baseline binaries are compatible with the committed schema; required for recorded container recovery
        required: false
        type: boolean
        default: false
      progress_run:
        description: Previous recorded-version recovery run/attempt to resume, preserving its exact recovery.json
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  # Reads whether the run that owns an unfinished deployment record has completed.
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.recovery_mode != 'recorded-versions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.report.outputs.candidate_git_commit }}
      baseline: ${{ steps.report.outputs.base_git_commit }}
      deployment_id: ${{ steps.report.outputs.current_deployment_id }}
      deployment_status: ${{ steps.report.outputs.current_deployment_status }}
      database_changed: ${{ steps.report.outputs.database_changed }}
      backup_id: ${{ steps.target.outputs.rollback_backup_id }}
      backup_name: ${{ steps.target.outputs.rollback_backup_name }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Fetch the selected release source into RUNNER_TEMP
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a lowercase 40-character Git SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$RELEASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/release-candidate" "$RELEASE_SHA"
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
      - name: Classify the selected production release for rollback
        id: report
        run: |
          mkdir -p .local
          node scripts/deploy-safety/release.ts rollback-report \
            --candidate "$RELEASE_SHA" \
            --candidate-root "$RUNNER_TEMP/release-candidate" \
            > .local/rollback-report.json
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
      - name: Resolve and verify the exact protected backup
        id: target
        run: |
          if [[ "$DATABASE_CHANGED" != "true" ]]; then
            echo "The latest production release is not classified as database-changing" >&2
            exit 1
          fi
          node scripts/deploy-safety/release.ts rollback-target \
            --candidate "$RELEASE_SHA" \
            --candidate-root "$RUNNER_TEMP/release-candidate" \
            --deployment-id "$DEPLOYMENT_ID" \
            --restored-backup "$RESTORED_BACKUP" \
            --report .local/rollback-report.json \
            > .local/rollback-target.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".local/rollback-report.json", "utf8"));
          const target = JSON.parse(readFileSync(".local/rollback-target.json", "utf8"));
          if (report.candidate.gitCommit !== process.env.RELEASE_SHA || report.databaseChanged !== true ||
              target.manualRestoreRequired !== true || !target.backupName || !target.backupId)
            throw new Error("Rollback plan did not match the selected database release");
          const lines = [
            "## Manual database rollback",
            "",
            `Selected deployment: ${process.env.DEPLOYMENT_ID} (${process.env.DEPLOYMENT_STATUS})`,
            `Selected release: ${report.candidate.gitCommit}`,
            `Previous production commit: ${report.base.gitCommit}`,
            `Protected PlanetScale backup: ${target.backupName} (ID ${target.backupId})`,
            `Recorded production branch: ${target.productionBranch}`,
            "",
            "The dispatcher named this backup as already restored in PlanetScale. The workflow does not restore the database or collect a restore receipt.",
            "",
            "The `production-release` job runs next without an approval step. It rechecks this report, deployment ID, candidate SHA and backup before building and deploying the previous commit.",
            "",
          ].join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines);
          NODE
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RESTORED_BACKUP: ${{ inputs.restored_backup }}
          DATABASE_CHANGED: ${{ steps.report.outputs.database_changed }}
          DEPLOYMENT_ID: ${{ steps.report.outputs.current_deployment_id }}
          DEPLOYMENT_STATUS: ${{ steps.report.outputs.current_deployment_status }}
      - uses: actions/upload-artifact@v4
        with:
          name: manual-production-rollback-report
          path: .local/rollback-report.json
          if-no-files-found: error
          retention-days: 7

  rollback:
    needs: plan
    if: always() && github.ref == 'refs/heads/main' && ((inputs.recovery_mode == 'recorded-versions' && needs.plan.result == 'skipped') || (inputs.recovery_mode != 'recorded-versions' && needs.plan.result == 'success' && needs.plan.outputs.candidate == inputs.release_sha))
    name: Deploy previous production release
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_OTLP_ENDPOINT: ${{ secrets.SENTRY_OTLP_ENDPOINT }}
      POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_ID }}
      EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID }}
      EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET }}
      EXECUTOR_OAUTH_ZOHO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_ID }}
      EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET }}
      EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID }}
      EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET }}
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      EXECUTOR_ENCRYPTION_KEY: ${{ secrets.EXECUTOR_ENCRYPTION_KEY }}
      MCP_SESSION_KEY_CURRENT: ${{ secrets.MCP_SESSION_KEY_CURRENT }}
      MCP_SESSION_KEY_PREVIOUS: ${{ secrets.MCP_SESSION_KEY_PREVIOUS }}
      APP_DOMAIN_CONTROL_SECRET: ${{ secrets.APP_DOMAIN_CONTROL_SECRET }}
      POOL_MANAGEMENT_KEY: ${{ secrets.POOL_MANAGEMENT_KEY }}
      POOL_DEPLOYMENT_KEY: ${{ secrets.POOL_DEPLOYMENT_KEY }}
      POOL_ACCEPTANCE_KEY: ${{ secrets.POOL_ACCEPTANCE_KEY }}
      POOL_ACCEPTANCE_MODEL: ${{ vars.POOL_ACCEPTANCE_MODEL }}
      POOL_APP_SIGNING_KEY: ${{ secrets.POOL_APP_SIGNING_KEY }}
      POOL_AVAILABILITY_TARGET: ${{ vars.POOL_AVAILABILITY_TARGET }}
      POOL_AUTOMATIC_RECOVERY_TARGET: ${{ vars.POOL_AUTOMATIC_RECOVERY_TARGET }}
      GOOGLE_MAPS_ROUTES_API_KEY: ${{ secrets.GOOGLE_MAPS_ROUTES_API_KEY }}
      POOL_APP_SIGNING_KEY_PREVIOUS: ${{ secrets.POOL_APP_SIGNING_KEY_PREVIOUS }}
      APP_DOMAIN_CONTROLLER_TOKEN: ${{ secrets.APP_DOMAIN_CONTROLLER_TOKEN }}
      EXECUTOR_OAUTH_ZENDESK_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_ID }}
      EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET }}
      EXECUTOR_OAUTH_GITLAB_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_ID }}
      EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET }}
      EXECUTOR_OAUTH_PLANETSCALE_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_PLANETSCALE_CLIENT_ID }}
      EXECUTOR_OAUTH_PLANETSCALE_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_PLANETSCALE_CLIENT_SECRET }}
      EXECUTOR_OAUTH_MIRO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_ID }}
      EXECUTOR_OAUTH_MIRO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_SECRET }}
      EXECUTOR_OAUTH_NOTION_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_NOTION_CLIENT_ID }}
      EXECUTOR_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_NOTION_CLIENT_SECRET }}
      EXECUTOR_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_TODOIST_CLIENT_ID }}
      EXECUTOR_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_TODOIST_CLIENT_SECRET }}
      EXECUTOR_OAUTH_TRELLO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_TRELLO_CLIENT_ID }}
      EXECUTOR_OAUTH_TRELLO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_TRELLO_CLIENT_SECRET }}
      EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID }}
      EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Recreate the exact selected-release and previous-source worktrees
        if: inputs.recovery_mode != 'recorded-versions'
        run: |
          if [[ "$RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" || ! "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Rollback inputs changed or are invalid" >&2
            exit 1
          fi
          git fetch --no-tags origin "$RELEASE_SHA"
          git fetch --no-tags origin "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/release-candidate" "$RELEASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/rollback-source" "$BASELINE_SHA"
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EXPECTED_RELEASE_SHA: ${{ needs.plan.outputs.candidate }}
          BASELINE_SHA: ${{ needs.plan.outputs.baseline }}
      - uses: actions/download-artifact@v4
        if: inputs.recovery_mode != 'recorded-versions'
        with:
          name: manual-production-rollback-report
          path: .local
      - name: Deploy and verify the previous production release
        if: inputs.recovery_mode != 'recorded-versions'
        run: |
          node scripts/deploy-safety/release.ts manual-rollback \
            --candidate "$RELEASE_SHA" \
            --candidate-root "$RUNNER_TEMP/release-candidate" \
            --rollback-root "$RUNNER_TEMP/rollback-source" \
            --deployment-id "$EXPECTED_DEPLOYMENT_ID" \
            --restored-backup "$RESTORED_BACKUP" \
            --report .local/rollback-report.json
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RESTORED_BACKUP: ${{ inputs.restored_backup }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.plan.outputs.deployment_id }}

      - name: Prepare the trusted recorded-recovery client
        if: inputs.recovery_mode == 'recorded-versions'
        run: npm run prepare:upstream

      - name: Recover the exact recorded versions without database changes
        if: inputs.recovery_mode == 'recorded-versions'
        run: node scripts/deploy-safety/recorded-recovery-entry.ts
        env:
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          RECOVERY_CANDIDATE: ${{ inputs.release_sha }}
          RECOVERY_SOURCE_RUN: ${{ inputs.recorded_run }}
          RECOVERY_PAIR_SHA256: ${{ inputs.recovery_pair_sha256 }}
          RECOVERY_DATABASE_COMPATIBLE: ${{ inputs.database_compatible }}
          RECOVERY_PROGRESS_RUN: ${{ inputs.progress_run }}
          RESTORED_BACKUP: ${{ inputs.restored_backup }}

      - name: Retain recorded-version recovery evidence and progress
        if: always() && inputs.recovery_mode == 'recorded-versions'
        uses: actions/upload-artifact@v4
        with:
          name: recorded-version-recovery
          include-hidden-files: true
          path: .local/recorded-version-recovery/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Retain release barrier receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-barrier
          include-hidden-files: true
          path: |
            .local/release-barrier/*.json
            ${{ runner.temp }}/candidate/.local/release-barrier/*.json
            ${{ runner.temp }}/rollback-source/.local/release-barrier/*.json
          if-no-files-found: ignore
