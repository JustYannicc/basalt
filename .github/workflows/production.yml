name: Production
# Alchemy's own plan and apply of a main commit, one smoke turn, and Cloudflare's own rollback of
# the updated Workers if that turn fails (scripts/production.ts).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan prints each row's name, type, action and why it is in the plan; deploy plans, applies and smokes
        required: true
        type: choice
        options: [plan, deploy]
        default: plan
      candidate:
        description: The full sha of the main commit to release
        required: true
        type: string
      fleet_classes:
        description: Declare the fleet's classes. Only turns them on, and creating them cannot be rolled back
        required: false
        type: boolean
        default: false
      approved_plan:
        description: For deploy, the plan digest a plan-only run of this commit printed; the deploy refuses when its own plan differs
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.BASALT_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    # The release's lock: a pending run waits for the one running, and never cancels it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production-release
      deployment: false
    # Whether the deploy reached its release step, and whether it stopped there before changing
    # production; `record` records every other deploy. A lost runner gives neither, so it is recorded.
    outputs:
      release: ${{ steps.release.outcome }}
      unchanged: ${{ steps.release.outputs.unchanged }}
      # Set once the apply succeeded and the smoke passed: the release is live, whatever the fleet
      # step after it says.
      released: ${{ steps.release.outputs.released }}
    env:
      BASALT_RELEASE_CANDIDATE: ${{ inputs.candidate }}
      BASALT_APPROVED_PLAN: ${{ inputs.approved_plan }}
      POOL_ROOT_PIN: ${{ vars.POOL_ROOT_PIN }}
      ZENDESK_MARKETPLACE_ORGANIZATION_ID: ${{ vars.ZENDESK_MARKETPLACE_ORGANIZATION_ID }}
      ZENDESK_MARKETPLACE_APP_ID: ${{ vars.ZENDESK_MARKETPLACE_APP_ID }}
      POOL_AVAILABILITY_TARGET: ${{ vars.POOL_AVAILABILITY_TARGET }}
      POOL_AUTOMATIC_RECOVERY_TARGET: ${{ vars.POOL_AUTOMATIC_RECOVERY_TARGET }}
      POOL_ACCEPTANCE_MODEL: ${{ vars.POOL_ACCEPTANCE_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release only a commit on main, named by its full sha
        run: |
          [ "$(git rev-parse HEAD)" = "$BASALT_RELEASE_CANDIDATE" ] || { echo "::error::candidate is not a full sha"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::candidate is not on main"; exit 1; }
      # Before the build: scripts/production.ts makes the same check before anything is written.
      - name: A deploy names the plan it applies
        if: inputs.mode == 'deploy'
        run: |
          printf '%s' "$BASALT_APPROVED_PLAN" | grep -Eiq '^ *[a-f0-9]{64} *$' || { echo "::error::a deploy needs approved_plan, the plan digest a plan-only run of this commit printed"; exit 1; }
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - name: Prepare
        run: npm run prepare:upstream
      - name: Build
        run: npm run build
      - name: ${{ inputs.mode == 'deploy' && 'Plan, apply and smoke' || 'Plan' }}
        id: release
        run: bun scripts/production.ts "${{ inputs.mode }}" ${{ inputs.fleet_classes && '--fleet-classes' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EXECUTOR_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_ID }}
          EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GOOGLE_CLIENT_SECRET }}
          EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_ID }}
          EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITHUB_OAUTH_CLIENT_SECRET }}
          EXECUTOR_OAUTH_ZENDESK_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_ID }}
          EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZENDESK_CLIENT_SECRET }}
          EXECUTOR_OAUTH_GITLAB_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_ID }}
          EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_GITLAB_CLIENT_SECRET }}
          EXECUTOR_OAUTH_PLANETSCALE_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_PLANETSCALE_CLIENT_ID }}
          EXECUTOR_OAUTH_PLANETSCALE_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_PLANETSCALE_CLIENT_SECRET }}
          EXECUTOR_OAUTH_MIRO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_ID }}
          EXECUTOR_OAUTH_MIRO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_MIRO_CLIENT_SECRET }}
          EXECUTOR_OAUTH_NOTION_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_NOTION_CLIENT_ID }}
          EXECUTOR_OAUTH_NOTION_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_NOTION_CLIENT_SECRET }}
          EXECUTOR_OAUTH_TODOIST_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_TODOIST_CLIENT_ID }}
          EXECUTOR_OAUTH_TODOIST_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_TODOIST_CLIENT_SECRET }}
          EXECUTOR_OAUTH_TRELLO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_TRELLO_CLIENT_ID }}
          EXECUTOR_OAUTH_TRELLO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_TRELLO_CLIENT_SECRET }}
          EXECUTOR_OAUTH_ZOHO_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_ID }}
          EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ZOHO_CLIENT_SECRET }}
          EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_ID }}
          EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_ATLASSIAN_CLIENT_SECRET }}
          EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_ID }}
          EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET: ${{ secrets.EXECUTOR_OAUTH_SLACK_REST_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          EXECUTOR_ENCRYPTION_KEY: ${{ secrets.EXECUTOR_ENCRYPTION_KEY }}
          MCP_SESSION_KEY_CURRENT: ${{ secrets.MCP_SESSION_KEY_CURRENT }}
          MCP_SESSION_KEY_PREVIOUS: ${{ secrets.MCP_SESSION_KEY_PREVIOUS }}
          APP_DOMAIN_CONTROL_SECRET: ${{ secrets.APP_DOMAIN_CONTROL_SECRET }}
          POOL_APP_SIGNING_KEY: ${{ secrets.POOL_APP_SIGNING_KEY }}
          GOOGLE_MAPS_ROUTES_API_KEY: ${{ secrets.GOOGLE_MAPS_ROUTES_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_OTLP_ENDPOINT: ${{ secrets.SENTRY_OTLP_ENDPOINT }}
          POSTHOG_PROJECT_KEY: ${{ secrets.POSTHOG_PROJECT_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POOL_APP_SIGNING_KEY_PREVIOUS: ${{ secrets.POOL_APP_SIGNING_KEY_PREVIOUS }}
          APP_DOMAIN_CONTROLLER_TOKEN: ${{ secrets.APP_DOMAIN_CONTROLLER_TOKEN }}
          POOL_MANAGEMENT_KEY: ${{ secrets.POOL_MANAGEMENT_KEY }}
          POOL_DEPLOYMENT_KEY: ${{ secrets.POOL_DEPLOYMENT_KEY }}
          # A masked secret: the ids of the registered models-only device acceptance signs a fresh
          # assertion for, per model call, with POOL_APP_SIGNING_KEY, or mid-rotation with
          # POOL_APP_SIGNING_KEY_PREVIOUS, the key the Worker serving before the apply knows.
          POOL_ACCEPTANCE_DEVICE: ${{ secrets.POOL_ACCEPTANCE_DEVICE }}
      # A deploy that died in its fleet step (a cancel, a timeout) printed no line about scale-out,
      # though its drain may have disabled the fleet. One read says where it stands.
      - name: Say where scale-out stands after a deploy that ended in its fleet step
        if: >-
          always() && inputs.mode == 'deploy' && steps.release.outputs.released == 'true' &&
          steps.release.outputs.fleet_line != 'written'
        timeout-minutes: 10
        run: bun scripts/release/fleet-recommit.ts standing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POOL_DEPLOYMENT_KEY: ${{ secrets.POOL_DEPLOYMENT_KEY }}

  # The Deployments page shows each production deploy under `production`, with the commit it
  # deployed: success when the deploy job succeeded, or applied and passed its smoke (a fleet step
  # that failed after it does not unmake a live release), failure when it did not. The record is the one
  # `release.yml` writes and its live check reads (a deployment of the candidate, not of the run's
  # commit), so the two paths agree on what production runs. A plan-only run, and a deploy that
  # stopped before it changed anything, write none; one that died on the way (a lost runner, a
  # timeout, a cancel) is recorded as failed. The deploy job's own colour stays the truth about the
  # deploy; this job fails only when the record could not, or must not, be written.
  record:
    needs: production
    if: >-
      always() && inputs.mode == 'deploy' && needs.production.result != 'skipped' &&
      needs.production.outputs.release != 'skipped' && needs.production.outputs.unchanged != 'true'
    runs-on: ${{ vars.BASALT_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      deployments: write
    steps:
      - name: Record the deployment of the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          RESULT: ${{ needs.production.result }}
          RELEASED: ${{ needs.production.outputs.released }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Applied with a passing smoke is live, so a success, even when the fleet step after it
          # failed: that step's red line stays the deploy job's own error.
          state=$({ [ "$RESULT" = success ] || [ "$RELEASED" = true ]; } && echo success || echo failure)
          payload=$(jq -cn --arg run "$GITHUB_RUN_ID" '{path: "production", run: $run}')
          missing() {
            echo "::error::The deploy ended $RESULT (its own job above is the truth about it), but its deployment record is missing: production's live check and the Deployments page do not show it. Re-run this record job alone (its own re-run, not \"Re-run failed jobs\", which would deploy again); it writes the record from this run's deploy result."
            exit 1
          }
          superseded() {
            echo "::error::The deploy ended $RESULT, but a later deploy recorded itself on production after this one began. This record would read as newer than that one, so it is not written; the later record is what production runs."
            exit 1
          }
          # Each call is tried again with a pause.
          retry() { for try in 1 2 3 4 5; do "$@" && return 0; sleep $((try * 10)); done; return 1; }
          started() {
            start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all" \
              --jq '[.jobs[] | select(.name == "production" and .started_at != null)] | max_by(.run_attempt) | .started_at // empty') &&
              [ -n "$start" ]
          }
          # Both workflows deploy under one lock, so a deployment created after this deploy job began
          # is a later deploy. A deployment this run already created (an earlier try, or the first
          # attempt of a re-run) is given its state instead of a second one being created.
          deployment() {
            list=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30") || return 1
            runs=$(jq -c 'map({id, created_at, run: ((.payload | if type == "string" then (fromjson? // {}) else . end) | .run? // "")})' <<<"$list") || return 1
            later=$(jq --arg run "$GITHUB_RUN_ID" --arg start "$start" 'map(select(.run != $run and .created_at > $start)) | length' <<<"$runs")
            [ "$later" = 0 ] || superseded
            id=$(jq -r --arg run "$GITHUB_RUN_ID" 'map(select(.run == $run)) | .[0].id // empty' <<<"$runs")
            [ -n "$id" ] && return 0
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" -f ref="$CANDIDATE" -f environment=production \
              -F auto_merge=false -f 'required_contexts[]' -f description="Production deploy" \
              -f payload="$payload" --jq .id) && [ -n "$id" ]
          }
          retry started || missing
          retry deployment || missing
          retry gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state="$state" -f log_url="$RUN_URL" >/dev/null || missing
          echo "Recorded the deployment of $CANDIDATE: $state."
