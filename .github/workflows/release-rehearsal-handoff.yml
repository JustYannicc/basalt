name: Release rehearsal handoff

# Deploy waits for both Check and the release rehearsal on the same main commit. Whichever finishes last releases
# it: Deploy when Check is last, this workflow when the rehearsal is. It reads a completed rehearsal run, which the
# rehearsal's own jobs can't, and runs no candidate code.
on:
  workflow_run:
    workflows: [Release rehearsal]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  handoff:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/release-rehearsal.yml'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Check that this commit's push Check passed too
        id: gate
        run: node scripts/release-merge/rehearsal-gate.ts ready
      # Manual release of main checks both again and releases the newest commit that qualifies.
      - name: Hand the rehearsed commit to Manual release of main
        if: steps.gate.outputs.ready == 'true'
        run: gh workflow run release-main.yml --repo "$GITHUB_REPOSITORY" --ref main -f candidate="$RELEASE_CANDIDATE_SHA"
