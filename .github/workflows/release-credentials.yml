name: Preview credential export

on:
  workflow_dispatch:
    inputs:
      pool_id:
        description: Native pool app ID in app_<uuid> form
        required: true
        type: string
      organization_id:
        description: Opaque organization ID supplied by the trusted operator
        required: true
        type: string
      owner_id:
        description: Opaque owner ID supplied by the trusted operator
        required: true
        type: string
      claude_account_id:
        description: Exact Claude account ID in the pool
        required: true
        type: string
      codex_account_id:
        description: Exact Codex account ID in the pool
        required: true
        type: string
      dedicated_throwaway_accounts:
        description: Confirm both selected accounts are dedicated throwaway accounts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-credential-export
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Export and replace the two preview login secrets
        run: node scripts/release-credentials/run.ts
        env:
          CREDENTIAL_POOL_ID: ${{ inputs.pool_id }}
          CREDENTIAL_ORGANIZATION_ID: ${{ inputs.organization_id }}
          CREDENTIAL_OWNER_ID: ${{ inputs.owner_id }}
          CREDENTIAL_CLAUDE_ACCOUNT_ID: ${{ inputs.claude_account_id }}
          CREDENTIAL_CODEX_ACCOUNT_ID: ${{ inputs.codex_account_id }}
          CREDENTIAL_DEDICATED_THROWAWAY_ACCOUNTS: ${{ inputs.dedicated_throwaway_accounts }}
          POOL_APP_SIGNING_KEY: ${{ secrets.POOL_APP_SIGNING_KEY }}
          RELEASE_UPDATE_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
