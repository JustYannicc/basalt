name: Release preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-updates/') &&
      contains(github.event.pull_request.labels.*.name, 'release-update')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Validate the exact release candidate before running its code
        run: |
          mkdir -p .local
          node scripts/release-merge/validate-candidate.ts > .local/candidate.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out the validated immutable candidate
        run: git checkout --detach "$CANDIDATE_HEAD"
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify the patch set and prepare the pinned build
        run: |
          npm run prepare:upstream
          npm run check:upstream
          npm run check:providers
      - name: Install the pinned native coding clients
        run: |
          npm install --prefix .ci-tools --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.309 @openai/codex@0.164.0
          echo "$GITHUB_WORKSPACE/.ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Plan isolated resources and encrypt the cleanup checkpoint
        run: |
          node scripts/preview/lifecycle.ts plan "$PREVIEW_PR"
          node scripts/release-preview/checkpoint.ts seal "$PREVIEW_PR" .local/preview-plan.json.enc
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          TEST_STAGE_DOMAIN: ${{ vars.TEST_STAGE_DOMAIN }}
          PREVIEW_STATE_KEY: ${{ secrets.PREVIEW_STATE_KEY }}
      - name: Save only the encrypted cleanup checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-cleanup-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: .local/preview-plan.json.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Deploy, sign in, exercise both clients, and verify teardown
        run: node scripts/release-preview/run.ts "$PREVIEW_PR"
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_MANIFEST_CHECKPOINTED: "1"
          TEST_STAGE_DOMAIN: ${{ vars.TEST_STAGE_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_ORGANIZATION: ${{ secrets.PLANETSCALE_ORGANIZATION }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          PREVIEW_STATE_KEY: ${{ secrets.PREVIEW_STATE_KEY }}
          PREVIEW_SMOKE_EMAIL: ${{ secrets.PREVIEW_SMOKE_EMAIL }}
          PREVIEW_SMOKE_PASSWORD: ${{ secrets.PREVIEW_SMOKE_PASSWORD }}
          PREVIEW_CLAUDE_AUTH_JSON: ${{ secrets.PREVIEW_CLAUDE_AUTH_JSON }}
          PREVIEW_CODEX_SUBSCRIPTION_AUTH_JSON: ${{ secrets.PREVIEW_CODEX_SUBSCRIPTION_AUTH_JSON }}
          PREVIEW_CODEX_CLI_AUTH_JSON: ${{ secrets.PREVIEW_CODEX_CLI_AUTH_JSON }}
          PREVIEW_CLAUDE_MODEL: ${{ vars.PREVIEW_CLAUDE_MODEL }}
          PREVIEW_CODEX_MODEL: ${{ vars.PREVIEW_CODEX_MODEL }}
      - name: Publish exact-head smoke and teardown proof
        uses: actions/upload-artifact@v4
        with:
          name: release-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: preview-receipt.json
          if-no-files-found: error
          retention-days: 30
