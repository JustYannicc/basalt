name: Guardrails

# Deterministic checks on how release work enters main. Each job names what it refused and why.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - name: Release-path changes ship alone
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/guardrails/ship-alone.ts "$BASE_SHA" "$HEAD_SHA"
      - name: Release tooling stays within its budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/guardrails/budget.ts "$BASE_SHA"
