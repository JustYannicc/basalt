name: Clients release

# Publishes the Signalbox apps once per clients version as signalbox-clients-<version>, the
# repository's Latest release. The apps hold no server logic, so versions change rarely.
# Pushes and pull requests build every package; only a manual run on main publishes, after the
# packages from that commit pass the platform acceptance walks (#209).
on:
  push:
    branches: [main]
    paths:
      - clients/package.json
      - clients/desktop/package.json
      - clients/mobile/package.json
      - clients/release-notes.md
      - .github/workflows/clients-release.yml
  pull_request:
    paths:
      - clients/release-notes.md
      - .github/workflows/clients-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the one clients version
        run: |
          clients="$(node -p 'require("./clients/package.json").version')"
          desktop="$(node -p 'require("./clients/desktop/package.json").version')"
          mobile="$(node -p 'require("./clients/mobile/package.json").version')"
          if [ "$clients" != "$desktop" ] || [ "$clients" != "$mobile" ]; then
            message="Clients release needs one version: clients/package.json is $clients, clients/desktop/package.json is $desktop and clients/mobile/package.json is $mobile."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "version=$clients" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/desktop-release-assets
        id: desktop-assets
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/desktop --frozen-lockfile
      - run: bun run --cwd clients/desktop build
      # The keyring's native module is installed for the runner's own architecture only, so each
      # runner packages its own: Apple Silicon on macos-latest, x64 on Windows and Linux.
      - name: Package the unsigned app
        run: bun run --cwd clients/desktop package:${{ matrix.platform }}
      - name: Package the command line connection
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          package="$RUNNER_TEMP/signalbox-cli"
          mkdir -p "$package"
          cp clients/desktop/.dist/connection.mjs "$package/signalbox-client.mjs"
          cp LICENSE "$package/LICENSE"
          keyring="$(node -p 'require("./clients/package.json").dependencies["@napi-rs/keyring"]')"
          node -e '
            const [version, keyring] = process.argv.slice(1);
            const manifest = {
              name: "signalbox-client", version, type: "module", license: "Apache-2.0",
              description: "Connect your local agents to Signalbox models and tools.",
              bin: { "signalbox-client": "signalbox-client.mjs" },
              dependencies: { "@napi-rs/keyring": keyring },
              engines: { node: ">=24.18.0" },
            };
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/signalbox-cli/package.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$keyring"
          sed -i '1{/^#!/!s|^|#!/usr/bin/env node\n|}' "$package/signalbox-client.mjs"
          (cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/clients/desktop/dist-packages")
      - uses: actions/cache/save@v4
        if: steps.desktop-assets.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/basalt-desktop-release-assets
          key: ${{ steps.desktop-assets.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: clients-${{ matrix.platform }}
          path: |
            clients/desktop/dist-packages/Signalbox-Client-*
            clients/desktop/dist-packages/signalbox-client-*.tgz
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4
      # The runner image ships JDK 17 and the Android SDK; nothing is downloaded from GitHub releases.
      - name: Use the runner's JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - run: bun install --cwd clients --frozen-lockfile
      - run: bun install --cwd clients/mobile --frozen-lockfile
      - name: Generate the Android project
        working-directory: clients/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: clients/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      # Expo signs release builds with its shared debug key. Re-signing with the project's own key
      # lets every later APK install over this one; a different key would force an uninstall.
      - name: Sign with the Signalbox release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            message="Missing ANDROID_RELEASE_KEYSTORE_BASE64 or ANDROID_RELEASE_KEYSTORE_PASSWORD; the APK can't be signed with the release key."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n1)"
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p "$RUNNER_TEMP/apk"
          "$tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias signalbox \
            --out "$RUNNER_TEMP/apk/Signalbox-android.apk" "$RUNNER_TEMP/apk/aligned.apk"
          rm "$keystore"
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/apk/Signalbox-android.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
      - uses: actions/upload-artifact@v4
        with:
          name: clients-android
          path: ${{ runner.temp }}/apk/Signalbox-android.apk
          if-no-files-found: error

  publish:
    needs: [version, desktop, android]
    # Any other event or branch would publish unaccepted bytes under a permanent version.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clients-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - name: Publish the clients version once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILT: ${{ runner.temp }}/built
          OUT: ${{ runner.temp }}/release
        run: |
          tag="signalbox-clients-$VERSION"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "$tag is already published. Published versions never change: raise version in clients/package.json, clients/desktop/package.json and clients/mobile/package.json." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # An interrupted create leaves a draft nobody can see; replace it with this build.
          if [ "$state" = "true" ]; then gh release delete "$tag" --yes; fi
          # Names without the version keep releases/latest/download/<name> links stable.
          mkdir -p "$OUT"
          take() {
            if [ ! -f "$BUILT/$1" ]; then
              message="The build produced no $1. Built files: $(ls "$BUILT")"
              echo "::error::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            cp "$BUILT/$1" "$OUT/$2"
          }
          take "Signalbox-Client-$VERSION-mac-arm64.dmg" Signalbox-mac-arm64.dmg
          take "Signalbox-Client-$VERSION-mac-arm64.zip" Signalbox-mac-arm64.zip
          take "Signalbox-Client-$VERSION-win-x64.exe" Signalbox-windows-x64-setup.exe
          take "Signalbox-Client-$VERSION-win-x64.zip" Signalbox-windows-x64.zip
          take "Signalbox-Client-$VERSION-linux-x86_64.AppImage" Signalbox-linux-x86_64.AppImage
          take "Signalbox-Client-$VERSION-linux-amd64.deb" Signalbox-linux-amd64.deb
          take Signalbox-android.apk Signalbox-android.apk
          take "signalbox-client-$VERSION.tgz" signalbox-cli.tgz
          (cd "$OUT" && sha256sum -- * > SHA256SUMS.txt)
          sed -e "s/{version}/$VERSION/g" -e "s|{repository}|$GITHUB_REPOSITORY|g" clients/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --latest \
            --title "Signalbox apps $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$OUT"/*
          echo "Published $tag." >> "$GITHUB_STEP_SUMMARY"
