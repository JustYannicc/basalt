name: Pool fleet
run-name: pool-fleet ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect reads only; configure-and-accept enables the fleet, accepts it and disables it again on any failure
        required: true
        default: inspect
        type: choice
        options: [inspect, configure-and-accept, disable, accept, crash-cell]
      go:
        description: The coordinator's literal GO (coordinator-20YY-...); required for configure-and-accept, disable and crash-cell
        required: false
        default: ""
        type: string
      active:
        description: Colour new cells launch in; default keeps the release rule (the primary's colour, else blue)
        required: false
        default: default
        type: choice
        options: [default, blue, green]

permissions:
  contents: read

# Shares the production release lock, so the fleet never changes inside a release, and a queued
# dispatch never cancels one already running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  fleet:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-release
      deployment: false
    steps:
      - name: Refuse a production change without a coordinator GO
        env:
          MODE: ${{ inputs.mode }}
          GO: ${{ inputs.go }}
        run: |
          case "$MODE" in
            configure-and-accept|disable|crash-cell)
              if ! printf '%s' "$GO" | grep -Eq '^coordinator-20[0-9]{2}-[A-Za-z0-9-]{1,96}$'; then
                echo "::error::mode $MODE needs a go input matching ^coordinator-20YY-"
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare the pinned SDK
        run: npm run prepare:upstream
      - name: Run the fleet lane
        run: |
          mkdir -p "$POOL_FLEET_OUTPUT_DIRECTORY"
          set -o pipefail
          bun scripts/pool-fleet/dispatch.ts 2>&1 | tee "$POOL_FLEET_OUTPUT_DIRECTORY/output.log"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POOL_DEPLOYMENT_KEY: ${{ secrets.POOL_DEPLOYMENT_KEY }}
          POOL_ACCEPTANCE_KEY: ${{ secrets.POOL_ACCEPTANCE_KEY }}
          POOL_APP_SIGNING_KEY: ${{ secrets.POOL_APP_SIGNING_KEY }}
          POOL_ACCEPTANCE_POOL: ${{ vars.POOL_ACCEPTANCE_POOL }}
          POOL_ACCEPTANCE_MODEL: ${{ vars.POOL_ACCEPTANCE_MODEL }}
          POOL_FLEET_MODE: ${{ inputs.mode }}
          POOL_FLEET_GO: ${{ inputs.go }}
          POOL_FLEET_ACTIVE: ${{ inputs.active != 'default' && inputs.active || '' }}
          POOL_FLEET_OUTPUT_DIRECTORY: ${{ runner.temp }}/pool-fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-fleet-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pool-fleet/
          if-no-files-found: ignore
          retention-days: 30
