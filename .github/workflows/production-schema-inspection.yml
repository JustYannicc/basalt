name: Production schema inspection

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Fixed schema inspection
        required: true
        type: choice
        default: schema-v1
        options: [schema-v1]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'JustYannicc/basalt' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.BASALT_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: production-release
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - name: Prepare trusted main source
        run: npm run prepare:upstream
      - name: Inspect production schema
        run: bun scripts/release-barrier/schema-inspection-entry.ts
        env:
          BASALT_SCHEMA_INSPECTION_SELECTION: ${{ inputs.selection }}
          BASALT_PREFLIGHT_STATE_URL: ${{ secrets.BASALT_PREFLIGHT_STATE_URL }}
          BASALT_PREFLIGHT_STATE_TOKEN: ${{ secrets.BASALT_PREFLIGHT_STATE_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-schema-inspection-${{ github.run_id }}
          path: .local/schema-inspection/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
