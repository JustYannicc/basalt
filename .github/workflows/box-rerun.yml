name: Box re-run

# After a Check completes, re-runs its jobs on GitHub's runners when box-watch cancelled it because
# the self-hosted box took none of its box jobs in time, or when a light job of it waited for the
# box's light runners and was cancelled before any took it, as light-rescue.yml leaves it
# (scripts/ci/box-rerun.ts), unless a person made that cancel, or when main's push Check failed
# only on the light runners. workflow_run always runs this file
# from the default branch, so no pull request's code runs here; it acts only on box-watch's own
# verdict for that run and attempt or on that light job's own record, and re-runs no job that
# failed off the box and light runners; a job that failed on a light runner is re-run hosted once.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions: {}

jobs:
  rerun:
    # Only a first attempt of this repository's own run, cancelled, or failed on main's push (the
    # light lane's only user): a fork's or a later attempt's cancel is never box-watch's, and a
    # re-run, being a later attempt, can't start another.
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')) &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # checks: read for who cancelled a light-held run, from its job's annotations.
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - name: Fetch box-watch's verdict, if it left one
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: box-watch-verdict
          path: ${{ runner.temp }}/box-watch-verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Re-run the box or light jobs that never started or lost their runner, unless a job failed for real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BOX_LABEL: ${{ vars.BASALT_CI_BOX_LABEL }}
          BOX_WATCH_VERDICT: ${{ runner.temp }}/box-watch-verdict/verdict.json
        run: node scripts/ci/box-rerun.ts
