name: App conventions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd scripts/app-lint --frozen-lockfile
      - name: Read the pinned host framework manifest
        run: node scripts/app-lint/prepare-host.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check every current app and connector source
        run: node scripts/app-lint/check.mjs
      - name: Prove rule failures and automatic app discovery
        run: node --test scripts/app-lint/*.test.mjs

  deliberate-red:
    name: red (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - default-export
          - effect-import
          - sdk-import
          - legacy-requirements
          - legacy-context
          - global-fetch
          - mutation-approval
          - module
          - framework-range
          - framework-host
          - source-count
          - source-size
          - source-utf8
          - public-count
          - public-file-size
          - public-total-size
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd scripts/app-lint --frozen-lockfile
      - run: node scripts/app-lint/prepare-host.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deliberately fail the normal app check
        run: node scripts/app-lint/proof.mjs ${{ matrix.case }}
