name: Pool basic native budget
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synthetic native gateway proof or existing container budget comparison
        required: true
        type: choice
        default: runtime-budget
        options: [runtime-budget, native-gateway]
      baseline:
        description: Baseline full commit
        default: 55eca77395e2fd411481013339c14a9d87cd9b09
        required: true
      candidate:
        description: Candidate full commit
        default: 1a59844d0c013d84639f4e4edb9c23793a16ab6a
        required: true
  pull_request:
    paths:
      - .github/workflows/pool-basic-budget.yml
      - scripts/pool-tests/budget/**
permissions:
  contents: read
jobs:
  budget:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'native-gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: fixture_root
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture_root"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOURCE_REF: ${{ matrix.version == 'baseline' && (inputs.baseline || '55eca77395e2fd411481013339c14a9d87cd9b09') || (inputs.candidate || '1a59844d0c013d84639f4e4edb9c23793a16ab6a') }}
      POOL_TEST_ADMIN_URL: postgresql://fixture_root:fixture-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: .probe-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify native amd64 and frozen source
        working-directory: .probe-source
        run: |
          test "$(uname -m)" = x86_64
          test "$(docker info --format '{{.Architecture}}')" = x86_64
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - name: Prepare the unchanged fixture
        working-directory: .probe-source
        run: |
          npm run prepare:upstream
          cd .upstream
          bun run e2e:prepare
      - name: Free runner build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          docker builder prune --all --force
      - name: Build the exact runtime
        working-directory: .probe-source
        run: docker build --target runtime --tag basalt-basic-budget:test containers/pool
      - name: Run three planned cold trials with unchanged deadlines
        working-directory: .probe-source
        shell: bash
        run: |
          probe="$GITHUB_WORKSPACE/scripts/pool-tests/budget"
          POOL_BUDGET_DOCKER="$(command -v docker)"
          export POOL_BUDGET_DOCKER
          export POOL_TEST_IMAGE=basalt-basic-budget:test
          mkdir -p "$RUNNER_TEMP/pool-budget/bin"
          ln -s "$probe/docker.py" "$RUNNER_TEMP/pool-budget/bin/docker"
          export PATH="$RUNNER_TEMP/pool-budget/bin:$PATH"
          for trial in 1 2 3; do
            export POOL_BUDGET_OUTPUT="$RUNNER_TEMP/pool-budget/trial-$trial"
            mkdir -p "$POOL_BUDGET_OUTPUT"
            export POOL_BUDGET_HTTP="$POOL_BUDGET_OUTPUT/http.jsonl"
            set +e
            node --import ../scripts/pool-tests/budget/observe.mjs --test scripts/pool-tests/container.test.ts > "$POOL_BUDGET_OUTPUT/test.log" 2>&1
            result=$?
            set -e
            echo "$result" > "$POOL_BUDGET_OUTPUT/exit-code"
            echo "Trial $trial test exit: $result"
          done
          python3 "$probe/summarize.py" "$RUNNER_TEMP/pool-budget" "$SOURCE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-basic-${{ matrix.version }}
          path: ${{ runner.temp }}/pool-budget/summary.json
          if-no-files-found: error

  native-gateway:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'native-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bind the proof to the exact dispatched head
        env:
          NATIVE_HEAD: ${{ inputs.candidate }}
          DISPATCHED_HEAD: ${{ github.sha }}
        run: |
          test "$NATIVE_HEAD" = "$DISPATCHED_HEAD"
          test "$(git rev-parse HEAD)" = "$NATIVE_HEAD"
          test "$(uname -s)" = Linux
          test "$(bun --version)" = 1.4.2
      - name: Install only the public native CLI dependencies
        run: |
          bun install --cwd src/setup --frozen-lockfile
          bun install --cwd clients --frozen-lockfile
      - name: Run the complete independent synthetic native proof
        env:
          NATIVE_HEAD: ${{ inputs.candidate }}
          NATIVE_OUTPUT: ${{ runner.temp }}/native-gateway-${{ matrix.repeat }}
        run: |
          ulimit -n 16384
          node clients/e2e/model-scale.mjs "$NATIVE_OUTPUT" "$NATIVE_HEAD" complete
      - name: Retain raw operations and gateway-only telemetry even after STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gateway-${{ inputs.candidate }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/native-gateway-${{ matrix.repeat }}
          if-no-files-found: error
          retention-days: 30
