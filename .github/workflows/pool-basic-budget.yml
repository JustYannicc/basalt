name: Atlassian family diagnostic budget
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full source commit to measure
        required: true
      trials:
        description: JSON array of independent trials
        default: '[1]'
        required: true
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: ${{ fromJSON(inputs.trials) }}
    env:
      BASALT_CI_OMIT_RELEASE_DOWNLOADS: "true"
      SOURCE_REF: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - run: npm run prepare:upstream
      - working-directory: .upstream
        run: bun run e2e:prepare
      - uses: ./.github/actions/setup-browser
      - name: Add setup timing without changing behavior
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('.upstream/e2e/tests/atlassian-family-screens.spec.ts')
          s = p.read_text()
          s = s.replace('const { atlassian, google, transport, fixture } = yield* familySetup([', 'const { atlassian, google, transport, fixture } = yield* evidence.step("Deploy family apps and restart product", familySetup([', 1)
          s = s.replace('          "calendar",\n        ]);', '          "calendar",\n        ]));', 1)
          p.write_text(s)
          PYTHON
      - name: Run the unchanged deadline
        working-directory: .upstream
        run: bun run e2e:self-host --test-name "$(node ../scripts/ci/e2e-pattern.ts dashboard-batch:google-byo-oauth-through-the-real-self-host-flow)"
      - name: Retain only closed timing fields
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          output = Path('budget-proof')
          output.mkdir(exist_ok=True)
          trials = []
          for p in Path('.generated/e2e-evidence').glob('*/evidence.json'):
              report = json.loads(p.read_text())
              for entry in report['entries']:
                  if not entry['title'].startswith('Jira and Confluence share one Atlassian sign-in'):
                      continue
                  row = {k: entry[k] for k in ['title', 'status', 'duration']}
                  evidence = p.parent / 'self-host/report/evidence' / entry['id']
                  row['steps'] = json.loads((evidence / 'steps.json').read_text())
                  row['requests'] = [dict(method=r['method'], status=r['status'], durationMs=r['durationMs'], operation='deploy' if r['path'].endswith('/apps/deploy') else 'other') for r in json.loads((evidence / 'requests.json').read_text())]
                  trials.append(row)
          if len(trials) != 1:
              raise SystemExit(f'Expected one measured scenario, found {len(trials)}')
          result = dict(source=os.environ['SOURCE_REF'], trials=trials)
          (output / 'timing.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlassian-budget-${{ matrix.trial }}
          path: budget-proof/timing.json
          if-no-files-found: error
