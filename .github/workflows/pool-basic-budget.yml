name: Atlassian family diagnostic budget
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full source commit to measure
        required: true
      workers:
        description: Worker count, empty uses the original runner default
        default: ''
        required: false
      trials:
        description: JSON array of independent trials
        default: '[1]'
        required: true
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: ${{ fromJSON(inputs.trials) }}
    env:
      BASALT_CI_OMIT_RELEASE_DOWNLOADS: "true"
      SOURCE_REF: ${{ inputs.source }}
      WORKERS: ${{ inputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - run: npm run prepare:upstream
      - working-directory: .upstream
        run: bun run e2e:prepare
      - uses: ./.github/actions/setup-browser
      - name: Add setup timing without changing behavior
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('.upstream/e2e/tests/atlassian-family-screens.spec.ts')
          s = p.read_text()
          if '"Deploy family apps and restart product"' not in s:
              start = 'const { atlassian, google, transport, fixture } = yield* familySetup(['
              end = '          "calendar",\n        ]);'
              if start not in s or end not in s:
                  raise SystemExit('Unknown untimed scenario shape; refusing to rewrite it')
              s = s.replace(start, 'const { atlassian, google, transport, fixture } = yield* evidence.step("Deploy family apps and restart product", familySetup([', 1)
              s = s.replace(end, '          "calendar",\n        ]));', 1)
              p.write_text(s)
          PYTHON
      - name: Run the unchanged deadline
        working-directory: .upstream
        run: |
          args=()
          if [ -n "$WORKERS" ]; then args+=(--workers "$WORKERS"); fi
          bun run e2e:self-host --test-name "$(node ../scripts/ci/e2e-pattern.ts dashboard-batch:google-byo-oauth-through-the-real-self-host-flow)" "${args[@]}"
      - name: Retain only closed timing fields
        if: always()
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          output = Path('budget-proof')
          output.mkdir(exist_ok=True)
          trials = []
          for p in Path('.generated/e2e-evidence').glob('*/evidence.json'):
              report = json.loads(p.read_text())
              for entry in report['entries']:
                  if not entry['title'].startswith(('Jira and Confluence share one Atlassian sign-in', 'Gmail offers only Google Calendar', 'Jira offers only Atlassian apps')):
                      continue
                  row = {k: entry[k] for k in ['title', 'status', 'duration']}
                  evidence = p.parent / 'self-host/report/evidence' / entry['id']
                  row['steps'] = json.loads((evidence / 'steps.json').read_text())
                  row['requests'] = [dict(method=r['method'], status=r['status'], durationMs=r['durationMs'], operation='deploy' if r['path'].endswith('/apps/deploy') else 'other') for r in json.loads((evidence / 'requests.json').read_text())]
                  trials.append(row)
          if len(trials) != 3:
              raise SystemExit(f'Expected three measured scenarios, found {len(trials)}')
          result = dict(source=os.environ['SOURCE_REF'], workers=os.environ['WORKERS'], scenarioSha256={str(p.relative_to('.upstream')): hashlib.sha256(p.read_bytes()).hexdigest() for p in [Path('.upstream/e2e/tests/atlassian-family-screens.spec.ts'), Path('.upstream/e2e/tests/atlassian-family-consent.spec.ts'), Path('.upstream/e2e/support/atlassian-family-screens.ts'), Path('.upstream/e2e/support/atlassian-family-connections.ts')]}, trials=trials)
          (output / 'timing.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if any(t['status'] != 'passed' or t['duration'] >= 30000 for t in trials):
              raise SystemExit('At least one scenario failed or exceeded the 30-second budget')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlassian-budget-${{ matrix.trial }}
          path: budget-proof/timing.json
          if-no-files-found: error
