name: Provision pool runtimes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, inspect, or apply the reviewed retained-state operation
        required: true
        default: inspect
        type: choice
        options: [plan, inspect, apply]
      packet:
        description: Read-only plan request, or reviewed operation packet with checksum and expiring GO
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.BASALT_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment:
      name: production-release
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24.18.0
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - name: Prepare the pinned SDK
        run: npm run prepare:upstream
      - name: Apply only the reviewed source operation
        run: bun scripts/release-barrier/provisioning-entry.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POOL_OBSERVATION_STORE_RESTORE_RUN_ID: ${{ vars.POOL_OBSERVATION_STORE_RESTORE_RUN_ID }}
          ALCHEMY_STAGE: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXECUTOR_ENCRYPTION_KEY: ${{ secrets.EXECUTOR_ENCRYPTION_KEY }}
          POOL_DEPLOYMENT_KEY: ${{ secrets.POOL_DEPLOYMENT_KEY }}
          POOL_FLEET_IMAGES: ${{ vars.POOL_FLEET_IMAGES }}
          POOL_PROVISIONING_MODE: ${{ inputs.mode }}
          POOL_PROVISIONING_PACKET: ${{ inputs.packet }}
          POOL_PROVISIONING_OUTPUT_DIRECTORY: ${{ runner.temp }}/pool-provisioning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-provisioning-${{ github.run_id }}
          path: ${{ runner.temp }}/pool-provisioning
          if-no-files-found: ignore
          retention-days: 30
