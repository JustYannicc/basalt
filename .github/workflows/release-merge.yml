name: Release merge

on:
  workflow_run:
    workflows:
      - Check
      - Release preview
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Validate exact-head release proofs and squash merge
        run: node scripts/release-merge/gate.ts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_UPDATE_TOKEN }}
